services:
  recorder:
    image: owntracks/recorder
    volumes:
      - config:/config
      - store:/store
    restart: unless-stopped
    networks:
      - traefik
    labels:
      traefik.enable: true
      traefik.http.routers.ntfy.rule: Host(`owntracks.74services.net`)
      glance.name: OwnTracks
      glance.id: owntracks
      glance.category: Security
      # glance.icon: sh:
      glance.url: https://owntracks.74services.net
      glance.description: Device Tracking
  
volumes:
  store:
  config:

networks:
  traefik:
    external: true