services:
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    environment:
      - WATCHTOWER_SCHEDULE=0 0 17 * * *
      - WATCHTOWER_MONITOR_ONLY=true
      - WATCHTOWER_NOTIFICATION_SKIP_TITLE=true
      - WATCHTOWER_NOTIFICATION_URL=ntfy://oreo:546827913@ntfy.74services.net/watchtower
    labels:
      - homepage.group=Monitoring
      - homepage.name=Watchtower
      - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/svg/watchtower.svg
      - homepage.description=Docker Image Version Management