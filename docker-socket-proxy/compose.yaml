services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: docker-socket-proxy
    restart: unless-stopped
    privileged: true
    environment:
      # Read-only API sections required by current Docker-aware consumers.
      CONTAINERS: "1"
      EVENTS: "1"
      IMAGES: "1"
      INFO: "1"
      NETWORKS: "1"
      VERSION: "1"
      # Never permit API write operations through this proxy.
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-socket-proxy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-q", "-O", "/dev/stdout", "http://localhost:2375/version"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s

networks:
  docker-socket-proxy:
    name: docker-socket-proxy
