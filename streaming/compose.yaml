services:
  jellyfin:
    image: jellyfin/jellyfin:12.3@sha256:2038fe038ab3876a80f6e7b7e0aef6607b032c7dc0c9b3ad3296d0b2eba3bbb5
    user: 1000:1000
    group_add:
      - "44"  # video
      - "993" # render
    volumes:
      - /mnt/docker-data/streaming/jellyfin-config:/config
      - /mnt/docker-data/streaming/jellyfin-cache:/cache
      - /mnt/nas/media/films:/media/films
      - /mnt/nas/media/shows:/media/shows
      - /mnt/nas/media/Music:/media/music
      - /mnt/nas/othermedia/media:/othermedia
      - /mnt/nas/othermedia/downloads:/data/downloads:ro
    devices:
      - /dev/dri:/dev/dri
    networks:
      - traefik
      - monitoring
    restart: unless-stopped
    environment:
      - JELLYFIN_PublishedServerUrl=https://stream.74services.net
    labels:
      traefik.enable: true
      traefik.http.routers.jellyfin.rule: Host(`stream.74services.net`)
      traefik.http.routers.jellyfin-metrics.rule: Host(`stream.74services.net`) && PathPrefix(`/metrics`)
      traefik.http.routers.jellyfin-metrics.priority: 100
      traefik.http.routers.jellyfin-metrics.middlewares: jellyfin-metrics-deny
      traefik.http.routers.jellyfin-metrics.service: jellyfin
      traefik.http.middlewares.jellyfin-metrics-deny.ipallowlist.sourcerange: 127.0.0.1/32,::1/128
      traefik.http.services.jellyfin.loadbalancer.server.port: 8096
      homelab.canonical-route: https://stream.74services.net
      glance.name: Jellyfin
      glance.id: jellyfin
      glance.category: Media
      glance.icon: sh:jellyfin
      glance.url: https://stream.74services.net
      glance.description: Movies and TV

  wizarr:
    image: ghcr.io/wizarrrr/wizarr:v2026.10.1@sha256:08f2c6de534ec7d36d39a4f55b7c5c379021ca881dc519c702aad0ddafbdc67a
    restart: unless-stopped
    networks:
      - traefik
    volumes:
      - /mnt/docker-data/streaming/wizarr-db:/data/database
    environment:
      - PUID=1000 #Set UID
      - PGID=1000 #Set GID
      - DISABLE_BUILTIN_AUTH=false #Set to true ONLY if you are using another auth provider (Authelia, Authentik, etc)
      - TZ=Europe/London #Set your timezone here
    labels:
      traefik.enable: true
      traefik.http.routers.wizarr.rule: Host(`wizarr.74services.net`)
      homelab.canonical-route: https://wizarr.74services.net
      glance.name: Wizarr
      glance.id: wizarr
      glance.category: Media
      glance.icon: sh:wizarr
      glance.url: https://wizarr.74services.net
      glance.description: Setup for Jellyfin

  navidrome:
    image: deluan/navidrome:latest@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
    user: 1000:1000
    networks:
      - traefik
    restart: unless-stopped
    # environment:
      # Optional: put your config options customization here. Examples:
      # ND_LOGLEVEL: debug
    volumes:
      - /mnt/docker-data/streaming/navidrome-data:/data
      - /mnt/nas/othermedia/media/music:/music:ro
    labels:
      traefik.enable: true
      traefik.http.routers.navidrome.rule: Host(`music.74services.net`)
      homelab.canonical-route: https://music.74services.net
      glance.name: Navidrome
      glance.id: navidrome
      glance.category: Media
      glance.icon: sh:navidrome
      glance.url: https://music.74services.net
      glance.description: Music Streaming

  kavita:
    image: jvmilazz0/kavita:latest@sha256:31181a32f0dda73cae68721867028a7253d57881b58bea5754cd9e578e75421a
    user: 1000:1000
    networks:
      - traefik
    volumes:
      # - /your/path/to/manga:/manga
      # - /your/path/to/comics:/comics
      - /mnt/nas/othermedia/media/books:/books
      - /mnt/docker-data/streaming/kavita-config:/kavita/config     # /kavita/config must not be changed
    environment:
      - TZ=Europe/London
    restart: unless-stopped
    labels:
      traefik.enable: true
      traefik.http.routers.kavita.rule: Host(`books.74services.net`)
      homelab.canonical-route: https://books.74services.net
      glance.name: Kavita
      glance.id: kavita
      glance.category: Media
      glance.icon: sh:kavita
      glance.url: https://books.74services.net
      glance.description: Book Library

networks:
  traefik:
    external: true
  monitoring:
    external: true
