  #     - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/svg/minecraft.svg
  #     - homepage.href=https://vanilla.play.74services.net/
  #     - homepage.description=Vanilla 1.21.4 Server

volumes:
  lspace-atm8: