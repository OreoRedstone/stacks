services:
  router:
    image: itzg/mc-router:latest@sha256:2c0e34af3ee92a68c349cb4d12a992dcd09032b3aa2f858f5b937401db2d64df
    container_name: mc-router
    command: "-debug -in-docker"
    # environment:
    #   MAPPING: |
    #     lspace-atm8.play.74services.net=lspace-atm8:25565
    #     vanilla.play.74services.net=vanilla:25565
    ports:
      - 25565:25565
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
  lspace-atm8:
    image: itzg/minecraft-server:java17@sha256:45d766d571783847bcae089fe8c5a6001d874f9e3f9907599b69f234806f1aa1
    environment:
      EULA: "TRUE"
      TYPE: AUTO_CURSEFORGE
      CF_API_KEY: ${CF_API_KEY}
      CF_SLUG: all-the-mods-8
      CF_FILENAME_MATCHER: 1.1.0
      INIT_MEMORY: 1G
      MAX_MEMORY: 8G
    volumes:
      - lspace-atm8:/data
    labels:
      - mc-router.host=lspace-atm8.play.74services.net
      - homepage.group=Minecraft
      - homepage.name=ATM8 1.1.0
      - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/svg/minecraft.svg
      - homepage.href=https://atm8.play.74services.net/
      - homepage.description=All the Mods 8 1.1.0 Server
  # vanilla:
  #   image: itzg/minecraft-server:java21
  #   environment:
  #     EULA: "TRUE"
  #     TYPE: PAPER
  #     VERSION: 1.21.4
  #   volumes:
  #     - ./vanilla/data:/data
  #   labels:
  #     - mc-router.host=vanilla.play.74services.net
  #     - homepage.group=Minecraft
  #     - homepage.name=Vanilla 1.21.4
  #     - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/svg/minecraft.svg
  #     - homepage.href=https://vanilla.play.74services.net/
  #     - homepage.description=Vanilla 1.21.4 Server

volumes:
  lspace-atm8: