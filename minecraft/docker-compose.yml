services:
  router:
    image: itzg/mc-router:latest@sha256:f176b4295163e99e129c00987877e07a58bf23635688c601388200f82f621123
    container_name: mc-router
    # environment:
    #   MAPPING: |
    #     lspace-atm8.play.74services.net=lspace-atm8:25565
    #     vanilla.play.74services.net=vanilla:25565
    ports:
      - 25565:25565
  lspace-atm8:
    image: itzg/minecraft-server:java17@sha256:ad131f26bde3d6c0839fd862fa707ae4e62ea00f52a970f5517a028bcd9bfeb7
    environment:
      EULA: "TRUE"
      TYPE: AUTO_CURSEFORGE
      CF_API_KEY: '$$2a$$10$$MSR7H/MJu9vzSD0wZYMKoOkhkRdpsXBEZfgeVYRrf76hP8RrCsDcK'
      CF_SLUG: all-the-mods-8
      CF_FILENAME_MATCHER: 1.1.0
      INIT_MEMORY: 1G
      MAX_MEMORY: 8G
    volumes:
      - lspace-atm8:/data
    labels:
      - mc-router.host=lspace-atm8.play.74services.net
      - homepage.group=Minecraft
      - homepage.name=ATM8 1.1.0
      - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/svg/minecraft.svg
      - homepage.href=https://atm8.play.74services.net/
      - homepage.description=All the Mods 8 1.1.0 Server
