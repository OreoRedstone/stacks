  vanilla:
    image: itzg/minecraft-server:2026.8.2-java25-alpine@sha256:4be1a83075ce4edb5821704b1eea91d3cee610c4dd879fb1d7bb09db8a6e7745
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      INIT_MEMORY: 1G
      MAX_MEMORY: 4G
      OPS: rapscallimango, oreoredstone
      ENABLE_WHITELIST: true
      WHITELIST: rapscallimango, queerlittlerat, oreoredstone
      TYPE: PAPER
    volumes:
      - /mnt/docker-data/minecraft/vanilla:/data
    labels:
      mc-router.host: vanilla.play.74services.net
      homelab.canonical-route: tcp://vanilla.play.74services.net:25565
      glance.parent: mc-router
      glance.name: Vanilla MC
      glance.category: Gaming
  deceased-craft:
      image: itzg/minecraft-server:2026.8.2-java21-alpine@sha256:725243f4c274bb7fc3f2b9eb9326bbcc6bf3fef86a126c831d0ae1296e1b49b9
      restart: unless-stopped
      environment:
        EULA: "TRUE"
        MOTD: Running %MODPACK_NAME% version %MODPACK_VERSION%
        TYPE: AUTO_CURSEFORGE
        CF_API_KEY: ${CF_API_KEY}
        CF_SLUG: deceasedcraft
        CF_FILENAME_MATCHER: 5.5.5
        INIT_MEMORY: 1G
        MAX_MEMORY: 12G
      volumes:
        - /mnt/docker-data/minecraft/deceased-craft:/data
        - /mnt/nas/backups/minecraft/deceased-craft:/backups
      labels:
        mc-router.host: deceased-craft.play.74services.net
        homelab.canonical-route: tcp://deceased-craft.play.74services.net:25565
        glance.parent: mc-router
        glance.name: DeceasedCraft
        glance.category: Gaming

networks:
  docker-socket-proxy:
    external: true
