services:
  router:
    image: itzg/mc-router:1.34.2@sha256:2c0e34af3ee92a68c349cb4d12a992dcd09032b3aa2f858f5b937401db2d64df
    command: "-debug -in-docker"
    # environment:
    #   MAPPING: |
    #     lspace-atm8.play.74services.net=lspace-atm8:25565
    #     vanilla.play.74services.net=vanilla:25565
    ports:
      - 25565:25565
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      glance.name: Minecraft
      glance.id: mc-router
      glance.category: Gaming
      glance.icon: sh:minecraft
      glance.url: https://play.74services.net
      glance.description: Minecraft Server System
  lspace-atm8:
    image: itzg/minecraft-server:2025.8.1-java17-alpine@sha256:6420f14e2ff4611e2d2d5d703b51f4079ad4737cfc993cbf7ba159dd548ddf84
    environment:
      EULA: "TRUE"
      TYPE: AUTO_CURSEFORGE
      CF_API_KEY: ${CF_API_KEY}
      CF_SLUG: all-the-mods-8
      CF_FILENAME_MATCHER: 1.1.0
      INIT_MEMORY: 1G
      MAX_MEMORY: 8G
    volumes:
      - lspace-atm8:/data
    labels:
      mc-router.host: lspace-atm8.play.74services.net
      glance.parent: mc-router
      glance.name: All the Mods 8
      glance.category: Gaming
  # vanilla:
