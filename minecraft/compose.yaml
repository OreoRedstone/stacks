services:
  router:
    image: itzg/mc-router:1.35.0@sha256:3743907d3aaa20a0c2f59f7e5b66d2cef595e128864eeb2c01862a02cd9119c5
    command: "-debug -in-docker"
    # environment:
    #   MAPPING: |
    #     lspace-atm8.play.74services.net=lspace-atm8:25565
    #     vanilla.play.74services.net=vanilla:25565
    ports:
      - 25565:25565
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      glance.name: Minecraft
      glance.id: mc-router
      glance.category: Gaming
      glance.icon: sh:minecraft
      glance.url: https://play.74services.net
      glance.description: Minecraft Server System
  lspace-atm8:
    image: itzg/minecraft-server:2025.9.0-java17-alpine@sha256:7bd4792767649bc2ec75b757ebaa1a504fa3ee6b3a431198be65261849d5e9e4
    environment:
      EULA: "TRUE"
      MOTD: Running %MODPACK_NAME% version %MODPACK_VERSION%
      TYPE: AUTO_CURSEFORGE
      CF_API_KEY: ${CF_API_KEY}
      CF_SLUG: all-the-mods-8
      CF_FILENAME_MATCHER: 1.1.0
      INIT_MEMORY: 1G
      MAX_MEMORY: 8G
    volumes:
      - lspace-atm8:/data
    labels:
      mc-router.host: lspace-atm8.play.74services.net
      glance.parent: mc-router
      glance.name: All the Mods 8
      glance.category: Gaming
  # vanilla:
  #   image: itzg/minecraft-server:java21
  #   environment:
  #     EULA: "TRUE"
  #     TYPE: PAPER
  #     VERSION: 1.21.4
  #   volumes:
  #     - ./vanilla/data:/data
  #   labels:
  #     - mc-router.host=vanilla.play.74services.net
  #     - homepage.group=Minecraft
  #     - homepage.name=Vanilla 1.21.4
  #     - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/svg/minecraft.svg
  #     - homepage.href=https://vanilla.play.74services.net/
  #     - homepage.description=Vanilla 1.21.4 Server

volumes:
  lspace-atm8: