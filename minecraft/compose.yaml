  jjk:
    image: itzg/minecraft-server:2025.10.5-java17-alpine@sha256:ecc762c91690d3f5fbfd1051aa07f173025dcaccfbf201984ddf395c21a5264f
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      MOTD: Running %MODPACK_NAME% version %MODPACK_VERSION%
      TYPE: MODRINTH
      MODRINTH_MODPACK: https://cloud.74services.net/public.php/dav/files/RekRMRQLoGxZkfg/?accept=zip
      INIT_MEMORY: 1G
      MAX_MEMORY: 6G
      OPS: oreoredstone
    volumes:
      - ./jjk/lostcities-server.toml:/data/defaultconfigs/lostcities-server.toml:ro
      - /mnt/docker-data/minecraft/jjk:/data
