    restart: unless-stopped
    command: "-debug -in-docker"
    environment:
      DOCKER_SOCKET: tcp://docker-socket-proxy:2375
    ports:
      - 25565:25565
    networks:
      - default
      - docker-socket-proxy
    labels:
      homelab.canonical-route: tcp://play.74services.net:25565
      glance.name: Minecraft
      glance.id: mc-router
      glance.category: Gaming
      glance.icon: sh:minecraft
      glance.url: https://play.74services.net
      glance.description: Minecraft Server System
