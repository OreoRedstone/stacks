services:
  restic-backup:
    image: restic/restic:latest@sha256:9940e6c7421ab3a21ee9fdc4e91596d04c792b600d31b102696c75cbf3ac4481

    entrypoint: /bin/sh

    command: >
      -c "
        set -e;

        echo '🔐 Setting up SSH...';

        mkdir -p /root/.ssh &&
        cp /ssh/id_ed25519 /root/.ssh/id_ed25519 &&
        cp /ssh/known_hosts /root/.ssh/known_hosts &&
        chmod 600 /root/.ssh/id_ed25519 &&
        chmod 600 /root/.ssh/known_hosts &&

        echo '📦 Starting backup at $(date)...';

        restic backup /data/docker-data /data/immich &&

        echo '🧹 Applying retention policy...';

        restic forget --keep-daily 7 --keep-weekly 4 --prune &&

        echo '✅ Backup complete at $(date)';
      "

    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}

    volumes:
      # data sources
      - /mnt/docker-data:/data/docker-data:ro
      - /mnt/immich-data:/data/immich:ro

      # ssh keys (read-only, fixed at runtime)
      - ./ssh:/ssh:ro

      # restic cache (optional but improves performance)
      - ./cache:/root/.cache/restic