services:
  app:
    image: traefik:v3.5@sha256:664bb8415fddadb71c2682b329c427d12c7d53593171665f2b7b6ff924509bc1
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.network=traefik"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.dashboard.address=:8080"
      - "--api.dashboard=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      traefik:
        ipv4_address: 172.32.0.10
      nginx:
    ports:
      - 4000:8080
    labels:
      glance.name: Traefik
      glance.id: traefik
      glance.category: Networking
      glance.icon: sh:traefik
      glance.description: Application Proxy

networks:
  nginx:
    external: true
  traefik:
    name: traefik
    ipam:
      config:
        - subnet: 172.32.0.0/16