services:
  app:
    image: traefik:v3.5@sha256:4e7175cfe19be83c6b928cae49dde2f2788fb307189a4dc9550b67acf30c11a5
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.network=traefik"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.dashboard.address=:8080"
      - "--api.dashboard=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nginx
      - traefik
    ports:
      - 4000:8080
    labels:
      - homepage.group=Networking
      - homepage.name=Traefik
      - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/svg/traefik-light.svg
      - homepage.href=http://192.168.0.100:4000
      - homepage.description=Application Proxy

networks:
  nginx:
    external: true
  traefik:
    name: traefik