apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: InfluxDB
    uid: dejhyxr0g2t4wf
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    editable: false
    jsonData:
      version: Flux
      organization: oreo-homelab
      defaultBucket: proxmox
      tlsSkipVerify: false
    secureJsonData:
      token: ${INFLUXDB_INIT_ADMIN_TOKEN}
