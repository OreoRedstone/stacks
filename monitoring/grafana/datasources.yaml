apiVersion: 1

datasources:
  - name: Prometheus
    uid: stacks-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    orgId: 1
    isDefault: true
    editable: false
    version: 1

  - name: InfluxDB
    uid: stacks-influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    orgId: 1
    editable: false
    version: 1
    jsonData:
      version: Flux
      organization: oreo-homelab
      defaultBucket: proxmox
      tlsSkipVerify: false
    secureJsonData:
      token: $INFLUXDB_GRAFANA_TOKEN
