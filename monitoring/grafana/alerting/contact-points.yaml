apiVersion: 1

contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy
        type: webhook
        disableResolveMessage: false
        settings:
          url: $NTFY_ALERT_URL?template=grafana
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $NTFY_ALERT_TOKEN
          title: '{{ template "default.title" . }}'
          message: '{{ template "default.message" . }}'
