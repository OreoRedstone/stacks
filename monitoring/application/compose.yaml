services:
  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2@sha256:5534ae91cbf3428998d60428d107cfdd97272d80658534ac6e54d8ce3b0c4d72
    restart: always
    command:
      - "--housekeeping_interval=10s"
      - "--docker_only"
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:rw
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - 3000:8080
    labels:
      glance.parent: grafana
      glance.name: cAdvisor
      glance.category: Management