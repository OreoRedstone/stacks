services:
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5@sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe
    restart: always
    command:
      - "--housekeeping_interval=10s"
      - "--docker_only"
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:rw
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - 3000:8080
    labels:
      glance.parent: grafana
      glance.name: cAdvisor
      glance.category: Management