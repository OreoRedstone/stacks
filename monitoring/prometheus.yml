global:
  scrape_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: cadvisor
    scrape_interval: 5s
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: node
    static_configs:
      - targets:
          - 10.44.0.1:9100
        labels:
          host: VPS
      - targets:
          - 10.44.0.2:9100
        labels:
          host: Applications VM
      - targets:
          - 10.44.0.3:9100
        labels:
          host: Proxmox
      - targets:
          - 10.44.0.5:9100
        labels:
          host: Backup Proxmox
      - targets:
          - 10.44.0.6:9100
        labels:
          host: Immich2 VM

  - job_name: traefik
    static_configs:
      - targets:
          - traefik:8082

  - job_name: jellyfin
    metrics_path: /metrics
    static_configs:
      - targets:
          - jellyfin:8096
        labels:
          service: Jellyfin

  - job_name: exportarr
    scrape_interval: 30s
    static_configs:
      - targets:
          - exportarr-sonarr:9707
        labels:
          app: Sonarr
      - targets:
          - exportarr-radarr:9707
        labels:
          app: Radarr
      - targets:
          - exportarr-lidarr:9707
        labels:
          app: Lidarr
      - targets:
          - exportarr-prowlarr:9707
        labels:
          app: Prowlarr

  - job_name: exportarr-bazarr
    scrape_interval: 60s
    static_configs:
      - targets:
          - exportarr-bazarr:9707
        labels:
          app: Bazarr

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_any]
    static_configs:
      - targets:
          - https://budget.74services.net
          - https://ha.74services.net
          - https://photos.74services.net
          - https://immich.74services.net
          - https://seerr.74services.net
          - https://bindery.74services.net
          - https://monitoring.74services.net
          - https://cloud.74services.net
          - https://collabora.74services.net
          - https://ntfy.74services.net
          - https://romm.74services.net
          - https://books.74services.net
          - https://stream.74services.net
          - https://wizarr.74services.net
          - https://music.74services.net
          - https://vault.74services.net
          - https://blog.74services.net
        labels:
          service_type: public-web
          alerting: enabled
      # Arr routes are deliberately excluded until their HTTPS redirect is
      # fixed; opt them in after a successful end-to-end probe.
      - targets:
          - https://prowlarr.74services.net
          - https://sonarr.74services.net
          - https://radarr.74services.net
          - https://lidarr.74services.net
          - https://bazarr.74services.net
        labels:
          service_type: public-web
          alerting: disabled
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
