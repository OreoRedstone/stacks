services:
  grafana:
    image: grafana/grafana-enterprise:12.1@sha256:063e0684335601dfef7301a6db1963b932b443141db176c590b53bb15debe770
    restart: unless-stopped
    user: 0:0 # Temp fix for permissions in the volume
    volumes:
      - /mnt/docker-data/monitoring/grafana-data:/var/lib/grafana
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      INFLUXDB_GRAFANA_TOKEN: ${INFLUXDB_GRAFANA_TOKEN:?required}
      NTFY_ALERT_URL: ${NTFY_ALERT_URL:?required}
      NTFY_ALERT_TOKEN: ${NTFY_ALERT_TOKEN:?required}
      GF_SERVER_ROOT_URL: https://monitoring.74services.net
    networks:
      - traefik
      - default
    labels:
      traefik.enable: true
      traefik.http.routers.grafana.rule: Host(`monitoring.74services.net`)
      homelab.canonical-route: https://monitoring.74services.net
      glance.name: Grafana
      glance.id: grafana
      glance.category: Management
      glance.icon: sh:grafana
      glance.url: https://monitoring.74services.net
      glance.description: Data Collection and Visualisation

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /mnt/docker-data/monitoring/prometheus-data:/prometheus
    networks:
      - default
      - monitoring
    labels:
      glance.parent: grafana
      glance.name: Prometheus
      glance.category: Management

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    restart: unless-stopped
    cap_drop:
      - ALL
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    labels:
      glance.parent: grafana
      glance.name: Blackbox Exporter
      glance.category: Management

  influxdb:
    image: influxdb:2.10@sha256:94e98bf5a07587c91bac4f6059aa2ddc172cd246bbd296852a30654192a38a03
    restart: unless-stopped
    ports:
      - 10.44.0.2:8086:8086
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD:?required}
      DOCKER_INFLUXDB_INIT_ORG: oreo-homelab
      DOCKER_INFLUXDB_INIT_BUCKET: proxmox
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN:?required}
    volumes:
      - /mnt/docker-data/monitoring/influx-data:/var/lib/influxdb2
    labels:
      glance.parent: grafana
      glance.name: InfluxDB
      glance.category: Management
      
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.61.1@sha256:4929b70e82079d001d0028b85d6a4dd25ad4666b719455c9542b983489963916
    restart: unless-stopped
    command:
      - "--housekeeping_interval=10s"
      - "--docker_only"
      - "--docker=tcp://docker-socket-proxy:2375"
    volumes:
    - /:/rootfs:ro
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - default
      - docker-socket-proxy
    labels:
      glance.parent: grafana
      glance.name: cAdvisor
      glance.category: Management

networks:
  traefik:
    external: true
  monitoring:
    external: true
  docker-socket-proxy:
    external: true
