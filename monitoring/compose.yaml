services:
  grafana:
    image: grafana/grafana-enterprise:12.1@sha256:063e0684335601dfef7301a6db1963b932b443141db176c590b53bb15debe770
    restart: unless-stopped
    user: 0:0 # Temp fix for permissions in the volume
    volumes:
      - /mnt/docker-data/monitoring/grafana-data:/var/lib/grafana
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      INFLUXDB_GRAFANA_TOKEN: ${INFLUXDB_GRAFANA_TOKEN:?required}
      NTFY_ALERT_URL: ${NTFY_ALERT_URL:?required}
      NTFY_ALERT_TOKEN: ${NTFY_ALERT_TOKEN:?required}
      GF_SERVER_ROOT_URL: https://monitoring.74services.net
    networks:
      - traefik
      - default
    labels:
      traefik.enable: true
      traefik.http.routers.grafana.rule: Host(`monitoring.74services.net`)
      homelab.canonical-route: https://monitoring.74services.net
      glance.name: Grafana
      glance.id: grafana
      glance.category: Management
      glance.icon: sh:grafana
      glance.url: https://monitoring.74services.net
      glance.description: Data Collection and Visualisation

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - default
      - monitoring
    labels:
      glance.parent: grafana
      glance.name: Prometheus
      glance.category: Management

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    restart: unless-stopped
    cap_drop:
      - ALL
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    labels:
      glance.parent: grafana
      glance.name: Blackbox Exporter
      glance.category: Management

  influxdb:
    image: influxdb:2.9@sha256:05d6fb735bc22449c401094d42846123a24e3325d3a6e092242a45bfd68fff21
    restart: unless-stopped
    ports:
      - 10.44.0.2:8086:8086
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD:?required}
      DOCKER_INFLUXDB_INIT_ORG: oreo-homelab
      DOCKER_INFLUXDB_INIT_BUCKET: proxmox
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN:?required}
    volumes:
      - /mnt/docker-data/monitoring/influx-data:/var/lib/influxdb2
    labels:
      glance.parent: grafana
      glance.name: InfluxDB
      glance.category: Management
      
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    restart: unless-stopped
    command:
      - "--housekeeping_interval=10s"
      - "--docker_only"
      - "--docker=tcp://docker-socket-proxy:2375"
    volumes:
    - /:/rootfs:ro
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - default
      - docker-socket-proxy
    labels:
      glance.parent: grafana
      glance.name: cAdvisor
      glance.category: Management

networks:
  traefik:
    external: true
  monitoring:
    external: true
  docker-socket-proxy:
    external: true
