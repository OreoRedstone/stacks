services:
  grafana:
    image: grafana/grafana-enterprise:12.1@sha256:063e0684335601dfef7301a6db1963b932b443141db176c590b53bb15debe770
    restart: "no"
    user: 0:0 # Temp fix for permissions in the volume
    volumes:
      - /mnt/docker-data/monitoring/grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN:?required}
    networks:
      - traefik
      - default
    labels:
      traefik.enable: true
      traefik.http.routers.grafana.rule: Host(`monitoring.74services.net`)
      glance.name: Grafana
      glance.id: grafana
      glance.category: Management
      glance.icon: sh:grafana
      glance.url: https://monitoring.74services.net
      glance.description: Data Collection and Visualisation

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    restart: "no"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    labels:
      glance.parent: grafana
      glance.name: Prometheus
      glance.category: Management

  influxdb:
    image: influxdb:2.9@sha256:270145207873eb426e15a211063532fc6f966f4ffb6edf4114ffac83ac4696eb
    restart: "no"
    ports:
      - 10.44.0.2:8086:8086
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD:?required}
      DOCKER_INFLUXDB_INIT_ORG: oreo-homelab
      DOCKER_INFLUXDB_INIT_BUCKET: proxmox
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN:?required}
    volumes:
      - /mnt/docker-data/monitoring/influx-data:/var/lib/influxdb2
    labels:
      glance.parent: grafana
      glance.name: InfluxDB
      glance.category: Management
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5@sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe
    restart: "no"
    command:
      - "--housekeeping_interval=10s"
      - "--docker_only"
    volumes:
    - /:/rootfs:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    labels:
      glance.parent: grafana
      glance.name: cAdvisor
      glance.category: Management

networks:
  traefik:
    external: true
