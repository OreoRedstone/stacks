services:
  grafana:
    image: grafana/grafana-enterprise:12.1@sha256:063e0684335601dfef7301a6db1963b932b443141db176c590b53bb15debe770
    restart: always
    user: 0:0 # Temp fix for permissions in the volume
    # ports:
    #  - 3000:3000
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - traefik
      - default
    labels:
      traefik.enable: true
      traefik.http.routers.grafana.rule: Host(`monitoring.control.74services.net`)
      glance.name: Grafana
      glance.id: grafana
      glance.category: Management
      glance.icon: sh:grafana
      glance.url: http://192.168.0.20:3000
      glance.description: Data Collection and Visualisation

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090
    labels:
      glance.parent: grafana
      glance.name: Prometheus
      glance.category: Management

  influxdb:
    image: influxdb:2.9@sha256:270145207873eb426e15a211063532fc6f966f4ffb6edf4114ffac83ac4696eb
    restart: always
    ports:
      - 8086:8086
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: oreo-homelab
      DOCKER_INFLUXDB_INIT_BUCKET: proxmox
    volumes:
      - influx-data:/var/lib/influxdb2
      - ./influx-configs:/etc/influxdb2/influx-configs
    labels:
      glance.parent: grafana
      glance.name: InfluxDB
      glance.category: Management

volumes:
  influx-data:
  grafana-data:

networks:
  traefik:
    external: true