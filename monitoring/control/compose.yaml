services:
  grafana:
    image: grafana/grafana-enterprise:13.0@sha256:c2dcc96197e07df991a666c7cc0895bc3aadf634e025491f2580b58b494a8aec
    restart: always
    user: 0:0 # Temp fix for permissions in the volume
    # ports:
    #  - 3000:3000
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - traefik
      - default
    labels:
      traefik.enable: true
      traefik.http.routers.grafana.rule: Host(`monitoring.control.74services.net`)
      glance.name: Grafana
      glance.id: grafana
      glance.category: Management
      glance.icon: sh:grafana
      glance.url: http://192.168.0.20:3000
      glance.description: Data Collection and Visualisation

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090
    labels:
      glance.parent: grafana
      glance.name: Prometheus
      glance.category: Management

  influxdb:
    image: influxdb:2.7@sha256:23bc959dcb97f85e1fbc3a739805203eb3bcb779afede002cb205a37e14442bb
    restart: always
    ports:
      - 8086:8086
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: oreo-homelab
      DOCKER_INFLUXDB_INIT_BUCKET: proxmox
    volumes:
      - influx-data:/var/lib/influxdb2
      - ./influx-configs:/etc/influxdb2/influx-configs
    labels:
      glance.parent: grafana
      glance.name: InfluxDB
      glance.category: Management

volumes:
  influx-data:
  grafana-data:

networks:
  traefik:
    external: true