services:
  grafana:
    image: grafana/grafana-enterprise:12.1@sha256:063e0684335601dfef7301a6db1963b932b443141db176c590b53bb15debe770
    restart: always
    user: 0:0 # Temp fix for permissions in the volume
    # ports:
    #  - 3000:3000
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - traefik
      - default
    labels:
      traefik.enable: true
      traefik.http.routers.grafana.rule: Host(`monitoring.control.74services.net`)
      glance.name: Grafana
      glance.id: grafana
      glance.category: Management
      glance.icon: sh:grafana
      glance.url: http://192.168.0.20:3000
      glance.description: Data Collection and Visualisation

  prometheus:
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090
    labels:
      glance.parent: grafana
      glance.name: Prometheus
      glance.category: Management

  influxdb:
    image: influxdb:2.7@sha256:23bc959dcb97f85e1fbc3a739805203eb3bcb779afede002cb205a37e14442bb
    restart: always
    ports:
      - 8086:8086
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: oreo-homelab
      DOCKER_INFLUXDB_INIT_BUCKET: proxmox
    volumes:
      - influx-data:/var/lib/influxdb2
      - ./influx-configs:/etc/influxdb2/influx-configs
    labels:
      glance.parent: grafana
      glance.name: InfluxDB
      glance.category: Management

volumes:
  influx-data:
  grafana-data:

networks:
  traefik:
    external: true