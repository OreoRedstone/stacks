services:
  grafana:
    image: grafana/grafana-enterprise:latest@sha256:23e1937c869e8ddf38bcad54bcfa5a11b60b84ec6e27e11215d93952cf95339e
    container_name: grafana
    restart: always
    user: 0:0 # Temp fix for permissions in the volume
    ports:
     - 3000:3000
    volumes:
      - grafana-data:/var/lib/grafana
    labels:
      - homepage.group=Monitoring
      - homepage.name=Grafana
      - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/svg/grafana.svg
      - homepage.href=http://192.168.0.100:3000
      - homepage.description=Data Visualisation

  prometheus:
    image: prom/prometheus:latest@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    labels:
      - homepage.group=Monitoring
      - homepage.name=Prometheus
      - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/svg/prometheus.svg
      - homepage.description=Metric Collection

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    container_name: cadvisor
    restart: always
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:rw
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    labels:
      - homepage.group=Monitoring
      - homepage.name=cAdvisor
      - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/svg/cadvisor.svg
      - homepage.description=Container Monitoring

  influxdb:
    image: influxdb:2@sha256:e4572d094ac3272f06528ea904ce6b4cb3bb19be2db3b3b1acbd27ba5c3a73e2
    container_name: influxdb
    restart: always
    ports:
      - 8086:8086
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: oreo-homelab
      DOCKER_INFLUXDB_INIT_BUCKET: proxmox
    volumes:
      - influx-data:/var/lib/influxdb2
      - ./influx-configs:/etc/influxdb2/influx-configs
    labels:
      - homepage.group=Monitoring
      - homepage.name=InfluxDB
      - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/svg/influxdb.svg
      - homepage.href=http://192.168.0.100:8096
      - homepage.description=Proxmox Monitoring

volumes:
  influx-data:
  grafana-data: