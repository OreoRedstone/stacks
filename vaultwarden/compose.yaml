services:
  app:
    image: vaultwarden/server:1.34.3-alpine@sha256:d70118b9dafb8588ee2651ceb5df68db27dcbd8e18467722010644ba48d5d6d6
    restart: unless-stopped
    environment:
      DOMAIN: "https://vault.74services.net"
    volumes:
      - data:/data/
    networks:
      - traefik
    labels:
      traefik.enable: true
      traefik.http.routers.vaultwarden.rule: Host(`vault.74services.net`) || Host(`vw.74services.net`)
      glance.name: Vaultwarden
      glance.id: vaultwarden
      glance.category: Security
      glance.icon: sh:vaultwarden
      glance.url: https://vault.74services.net
      glance.description: Password Management

volumes:
  data:

networks:
  traefik:
    external: true