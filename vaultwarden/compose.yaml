services:
  app:
    image: vaultwarden/server:1.37.3-alpine@sha256:9a905c5cf5df61bb827da3805e160170741c0b53b0c63bb07e1afd3d2e21b1c8
    restart: unless-stopped
    environment:
      DOMAIN: "https://vault.74services.net"
    volumes:
      - /mnt/docker-data/vaultwarden/data:/data/
    networks:
      - traefik
    labels:
      traefik.enable: true
      traefik.http.routers.vaultwarden.rule: Host(`vault.74services.net`)
      homelab.canonical-route: https://vault.74services.net
      glance.name: Vaultwarden
      glance.id: vaultwarden
      glance.category: Security
      glance.icon: sh:vaultwarden
      glance.url: https://vault.74services.net
      glance.description: Password Management

networks:
  traefik:
    external: true
