services:
  vaultwarden:
    image: vaultwarden/server:1.34.3-alpine@sha256:d70118b9dafb8588ee2651ceb5df68db27dcbd8e18467722010644ba48d5d6d6
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "https://vw.74services.net"
    volumes:
      - data:/data/
    networks:
      - nginx-proxy
    labels:
      - homepage.group=Security
      - homepage.name=Vaultwarden
      - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/svg/vaultwarden-light.svg
      - homepage.href=https://vw.74services.net/
      - homepage.description=Data Vault

volumes:
  data:

networks:
  nginx-proxy:
    external: true