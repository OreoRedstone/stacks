services:
  vaultwarden:
    image: vaultwarden/server:latest@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "https://vw.74services.net"
    volumes:
      - data:/data/
    networks:
      - nginx-proxy
    labels:
      - homepage.group=Security
      - homepage.name=Vaultwarden
      - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/svg/vaultwarden-light.svg
      - homepage.href=https://vw.74services.net/
      - homepage.description=Data Vault

volumes:
  data:

networks:
  nginx-proxy:
    external: true