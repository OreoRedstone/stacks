services:
  nginx:
    container_name: nginx-reverse-proxy
    image: nginx:stable@sha256:24ccf9a6192d2c6c5c4a6e9d2fdfa2a8e382b15f8dd7d0e05a1579f6a46f7776
    restart: always
    networks:
      - nginx-proxy
    ports:
      - 443:443
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # - ./logs:/var/log/nginx
    labels:
      - homepage.group=Security
      - homepage.name=Nginx
      - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/svg/nginx.svg
      - homepage.description=Nginx Reverse Proxy

networks:
  nginx-proxy:
    name: nginx-proxy