services:
  nginx:
    container_name: nginx-reverse-proxy
    image: nginx:stable@sha256:755983e0e0e568e4c86297cc91485d7a6f9fb73e42d8a19cdba3eac9e8b8cfc9
    restart: always
    networks:
      - nginx-proxy
    ports:
      - 443:443
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # - ./logs:/var/log/nginx
    labels:
      - homepage.group=Security
      - homepage.name=Nginx
      - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/svg/nginx.svg
      - homepage.description=Nginx Reverse Proxy

networks:
  nginx-proxy:
    name: nginx-proxy