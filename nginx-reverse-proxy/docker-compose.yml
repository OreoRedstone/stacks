services:
  nginx:
    container_name: nginx-reverse-proxy
    image: nginx:1.29-alpine-perl@sha256:b04b512a3daf265299d237dcef02909b4f3fa998800030d1beef22e29d36ee97
    restart: always
    networks:
      - nginx-proxy
    ports:
      - 443:443
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # - ./logs:/var/log/nginx
    labels:
      - homepage.group=Security
      - homepage.name=Nginx
      - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/svg/nginx.svg
      - homepage.description=Nginx Reverse Proxy

networks:
  nginx-proxy:
    name: nginx-proxy