services:
  nginx:
    container_name: nginx-reverse-proxy
    image: nginx:stable@sha256:7fad6c0dff97965adbddf28027d934b111fc0221a554315dc274712f3fba24d3
    restart: always
    networks:
      - nginx-proxy
    ports:
      - 443:443
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # - ./logs:/var/log/nginx
    labels:
      - homepage.group=Security
      - homepage.name=Nginx
      - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/svg/nginx.svg
      - homepage.description=Nginx Reverse Proxy

networks:
  nginx-proxy:
    name: nginx-proxy