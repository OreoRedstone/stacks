http {
	ssl_certificate     /etc/letsencrypt/live/74services.net/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/74services.net/privkey.pem;

	# Default
	server {
		listen 443 ssl default_server;

		return 404;
	}

	server {
		listen 443 ssl;

		server_name deploy.*;

		location / {
			proxy_pass http://komodo-core-1:9120;

			proxy_set_header Host $http_host;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}
	}

	server {
		listen 443 ssl;

		server_name wizarr.*;

		location / {
			proxy_pass http://wizarr:5690;

			proxy_set_header Host $http_host;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}
	}

	# Keycloak
	# server {
	# 	listen 443 ssl;

	# 	server_name sso.*;

	# 	location / {
	# 		proxy_pass http://authentik:9000;

	# 		proxy_set_header Host $http_host;
	# 		proxy_set_header Upgrade $http_upgrade;
	# 		proxy_set_header Connection "upgrade";
	# 		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	# 	}
	# }

	# Collabora for Nextcloud
	server {
		listen 443 ssl;

		server_name office.*;

		location / {
			proxy_pass http://collabora:9980;

			proxy_set_header Host $http_host;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}
	}

	# Ntfy
	server {
		listen 443 ssl;

		server_name ntfy.*;

		location / {
			proxy_pass http://ntfy:80;

			proxy_buffering off;
			proxy_request_buffering off;
			proxy_redirect off;

			proxy_set_header Host $http_host;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

			proxy_connect_timeout 3m;
			proxy_send_timeout 3m;
			proxy_read_timeout 3m;

			client_max_body_size 0; # Stream request body to backend
		}
	}

	# Nextcloud
	server {
		listen 443 ssl;

		server_name cloud.*;

		location / {
			proxy_pass http://nextcloud;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			client_max_body_size 0;
			add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
		}
	}

	# Nextcloud old link
	server {
		listen 443 ssl;

		server_name files.*;

		if ($host ~ ^files\.(?<domain>.+)$) {
			return 301 $scheme://cloud.$domain$request_uri;
		}
	}

	# Jellyfin
	server {
		listen 443 ssl;

		server_name stream.*;

		# Security / XSS Mitigation Headers
		add_header X-Content-Type-Options "nosniff";

		# Permissions policy. May cause issues with some clients
		add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), battery=(), bluetooth=(), camera=(), clipboard-read=(), display-capture=(), document-domain=(), encrypted-media=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), interest-cohort=(), keyboard-map=(), local-fonts=(), magnetometer=(), microphone=(), payment=(), publickey-credentials-get=(), serial=(), sync-xhr=(), usb=(), xr-spatial-tracking=()" always;

		# Content Security Policy
		# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
		# Enforces https content and restricts JS/CSS to origin
		# External Javascript (such as cast_sender.js for Chromecast) must be whitelisted.
		# DISABLED TO MAKE IT WORK ON TV
		# add_header Content-Security-Policy "default-src https: data: blob: ; img-src 'self' https://* ; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.youtube.com blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; font-src 'self'";

		location / {
			# Proxy main Jellyfin traffic
			proxy_pass http://jellyfin:8096;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Protocol $scheme;
			proxy_set_header X-Forwarded-Host $http_host;

			# Disable buffering when the nginx proxy gets very resource heavy upon streaming
			proxy_buffering off;
    	}

		location /socket {
			# Proxy Jellyfin Websockets traffic
			proxy_pass http://jellyfin:8096;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Protocol $scheme;
			proxy_set_header X-Forwarded-Host $http_host;
		}
	}

	# Blog
	server {
		listen 443 ssl;

		server_name blog.*;
		location / {
			proxy_pass http://192.168.0.74;
		}
	}

	# Vaultwarden
	server {
		listen 443 ssl;

		server_name vw.*;
		location / {
			proxy_pass http://vaultwarden;
		}
	}

	# Immich old link
	server {
		listen 443 ssl;

		server_name immich.*;
		
		if ($host ~ ^immich\.(?<domain>.+)$) {
			return  301 $scheme://photos.$domain$request_uri;
		}
	}

	# Immich
	server {
		listen 443 ssl;

		server_name photos.*;

		# allow large file uploads
		client_max_body_size 50000M;

		# Set headers
		proxy_set_header Host              $http_host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# enable websockets: http://nginx.org/en/docs/http/websocket.html
		proxy_http_version 1.1;
		proxy_set_header   Upgrade    $http_upgrade;
		proxy_set_header   Connection "upgrade";
		proxy_redirect     off;

		# set timeout
		proxy_read_timeout 600s;
		proxy_send_timeout 600s;
		send_timeout       600s;

		location / {
			proxy_pass http://immich-server:2283;
		}
	}
}
events {}