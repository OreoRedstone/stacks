services:
  server:
    image: devidian/spaceengineers:winestaging@sha256:a09dbb38ab62b2c68161b27dd2ab88a59295f3f08ad7397881da0886fc877d79
    volumes:
      - /mnt/docker-data/space-engineers/data:/appdata/space-engineers
      - /mnt/docker-data/space-engineers/steam:/root/.steam
    ports:
      - target: 27016
        published: 27016
        protocol: udp
        mode: host
    environment:
      - WINEDEBUG=-all
      - INSTANCE_NAME=SpaceEngineersDedicated
      - PUBLIC_IP: ${PUBLIC_IP:?required}
      # public ip required for healthcheck
    labels:
      glance.name: Space Engineers
      glance.id: space-engineers
      glance.category: Gaming
      glance.description: Space Engineers Dedicated Server
