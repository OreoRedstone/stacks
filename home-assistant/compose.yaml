services:
  app:
    image: ghcr.io/home-assistant/home-assistant:2025.9@sha256:89ec0583c7f47c8a150204f6b5ed48b5432026012bebe1226cf72775a795a5e1 
    volumes:
      - /mnt/docker-data/home-assistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    # privileged: true
    networks:
      - traefik
    labels:
      traefik.enable: true
      traefik.http.routers.home-assistant.rule: Host(`ha.74services.net`)
      traefik.http.services.home-assistant.loadbalancer.server.port: 8123
      glance.name: Home Assistant
      glance.id: home-assistant
      glance.category: Management
      glance.icon: sh:home-assistant
      glance.url: https://ha.74services.net
      glance.description: Home Management

networks:
  traefik:
    external: true