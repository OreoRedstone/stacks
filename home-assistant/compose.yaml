services:
  app:
    image: ghcr.io/home-assistant/home-assistant:2025.12@sha256:9a5a3eb4a213dfb25932dee9dc6815c9305f78cecb5afa716fa2483163d8fb5b 
    volumes:
      - config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    # privileged: true
    networks:
      - traefik
    labels:
      traefik.enable: true
      traefik.http.routers.home-assistant.rule: Host(`ha.74services.net`)
      traefik.http.services.home-assistant.loadbalancer.server.port: 8123
      glance.name: Home Assistant
      glance.id: home-assistant
      glance.category: Management
      glance.icon: sh:home-assistant
      glance.url: https://ha.74services.net
      glance.description: Home Management

volumes:
  config:

networks:
  traefik:
    external: true