services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.4@sha256:a1a578fdcfc72754985c3b3b26e4f398a6a782e354d10cf2b156ecbf06d252e9
    container_name: homepage
    ports:
      - 80:3000
    volumes:
      - ./config:/app/config # Make sure your local config directory exists
      - ./images:/app/public/images
      - /var/run/docker.sock:/var/run/docker.sock # (optional) For docker integrations
    environment:
      HOMEPAGE_ALLOWED_HOSTS: 192.168.0.100 # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts