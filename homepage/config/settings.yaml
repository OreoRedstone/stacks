---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/settings/

providers:
  openweathermap: openweathermapapikey
  weatherapi: weatherapiapikey

background: images/cyberpunk.jpg
cardBlur: md
theme: dark
bookmarksStyle: icons

layout:
  Game Servers:
    style: row
    Minecraft:
      style: column
  Main:
    header: false
    style: row
    columns: 4
    Left:
      header: false
      style: column
      Management:
        style: column
      Networking:
        style: column
    Media:
      style: column
    Monitoring:
      style: column
    Security:
      style: column