services:
  server:
    image: factoriotools/factorio:2.0.77@sha256:d98a1554e7de21c299f263fde85cbec5c577afae2cef656378be8b658e929d6a
    restart: unless-stopped
    ports:
      - 34197:34197/udp
    volumes:
      - /mnt/docker-data/factorio/space-exploration:/factorio
      - ./mod-list.json:/factorio/mods/mod-list.json
      - ./server-settings.json:/factorio/config/server-settings.json
    environment:
      USERNAME: ${USERNAME}
      TOKEN: ${TOKEN}
      UPDATE_MODS_ON_START: TRUE
    labels:
      glance.name: Factorio Server
      glance.category: Gaming