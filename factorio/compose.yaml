services:
  server:
    image: factoriotools/factorio:stable-2.0.77@sha256:312341f29987b5a6b11f00ba8240192f7564936af9913384d13f7f4c535708ef
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/start.sh"]
    ports:
      - 34197:34197/udp
    volumes:
      - /mnt/docker-data/factorio/space-exploration:/factorio
      - ./mod-list.json:/tmp/mod-list.json:ro
      - ./server-settings.json:/tmp/server-settings.json:ro
      - ./start.sh:/start.sh:ro
    environment:
      USERNAME: ${USERNAME}
      TOKEN: ${TOKEN}
      UPDATE_MODS_ON_START: TRUE
      DLC_SPACE_AGE: FALSE
    labels:
      glance.name: Factorio Server
      glance.category: Gaming
