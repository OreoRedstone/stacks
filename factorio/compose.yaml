services:
  server:
    image: factoriotools/factorio:1.1.110@sha256:6fb9b7bfb12fb51bf668fce7e29cb1e98053f248201e64dfee870ef73b2f31cb
    restart: unless-stopped
    ports:
      - 34197:34197/udp
    volumes:
      - /mnt/docker-data/factorio/space-exploration:/factorio
      - ./mod-list.json:/factorio/mods/mod-list.json
      - ./server-settings.json:/factorio/config/server-settings.json
    environment:
      USERNAME: ${USERNAME}
      TOKEN: ${TOKEN}
    labels:
      glance.name: Factorio Server
      glance.category: Gaming