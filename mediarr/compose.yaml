services:
  vpn:
    image: qmcgaw/gluetun:latest@sha256:89e3cbe22e0d6f09a18d3e86269392fd9f7f08e8991040741e577f8f127cdfe4
    restart: "no"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file: .env
    environment:
      TZ: Europe/London
    ports:
      - 8112:8112 # deluge web UI Port
      - 58846:58846
      # - 6881:6881 # more deluge
    dns:
      - 1.1.1.1
    #   - 9.9.9.9
    networks:
      - traefik
      - arr
    labels:
      traefik.enable: true
      traefik.http.routers.prowlarr.rule: Host(`prowlarr.74services.net`)
      traefik.http.services.prowlarr.loadbalancer.server.port: 9696
      glance.parent: deluge
      glance.name: Gluetun
      glance.category: Arr

  deluge:
    image: lscr.io/linuxserver/deluge:latest@sha256:9505c64720afa9e5f0ac1576e660dd6d1e9d4a6733b791f4821e8f496f19f41f
    restart: "no"
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/London
    volumes:
      - /mnt/docker-data/mediarr/deluge-config:/config
      - /mnt/nas/othermedia/downloads:/data/downloads
    network_mode: 'service:vpn'
    depends_on:
      - vpn
    labels:
      glance.name: Deluge
      glance.id: deluge
      glance.category: Arr
      glance.icon: sh:deluge
      glance.description: Media Acquisition
      glance.url: http://192.168.0.100:8112

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest@sha256:91844fa2c927ad6ede5630127183cc7868b175f6223e83e6a5da1fffea2aa782
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/London
    volumes:
      - /mnt/docker-data/mediarr/prowlarr-config:/config
    restart: "no"
    network_mode: 'service:vpn'
    depends_on:
      - vpn
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    labels:
      glance.name: Prowlarr
      glance.id: prowlarr
      glance.category: Arr
      glance.icon: sh:prowlarr
      glance.description: Media Indexing
      glance.url: https://prowlarr.74services.net

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest@sha256:c19aa4ecdf03d73e1d5c901da33744cb7eb4d921f89bafed1ca264601d7fa224
    restart: "no"
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/London
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/docker-data/mediarr/sonarr-config:/config
      - /mnt/nas/othermedia:/data
    networks:
      - arr
      - traefik
    labels:
      traefik.enable: true
      traefik.http.routers.sonarr.rule: Host(`sonarr.74services.net`)
      glance.name: Sonarr
      glance.id: sonarr
      glance.category: Arr
      glance.icon: sh:sonarr
      glance.description: Show Management
      glance.url: https://sonarr.74services.net

  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:119aaa4a4f7349bcd2a136c5373a0d7925b5479915c7dfe0c0ad352db2a6d438
    restart: "no"
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/London
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/docker-data/mediarr/radarr-config:/config
      - /mnt/nas/othermedia:/data
    networks:
      - arr
      - traefik
    labels:
      traefik.enable: true
      traefik.http.routers.radarr.rule: Host(`radarr.74services.net`)
      glance.name: Radarr
      glance.id: radarr
      glance.category: Arr
      glance.icon: sh:radarr
      glance.description: Film Management
      glance.url: https://radarr.74services.net

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest@sha256:c74c32408fdf6e7926ad62641fc1a5544206ee65c33f2188bb179edb30e28f5a
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/London
    volumes:
      - /mnt/docker-data/mediarr/lidarr-config:/config
      - /mnt/nas/othermedia:/data
    networks:
      - arr
      - traefik
    restart: "no"
    labels:
      traefik.enable: true
      traefik.http.routers.lidarr.rule: Host(`lidarr.74services.net`)
      glance.name: Lidarr
      glance.id: lidarr
      glance.category: Arr
      glance.icon: sh:lidarr
      glance.description: Music Management
      glance.url: https://lidarr.74services.net
      
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest@sha256:a20fb11a440d704a9d61c283aa26462aad33dc63223b173f8d8c77d33e8e9d59
    restart: "no"
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/London
      UMASK_SET: 022
    volumes:
      - /mnt/docker-data/mediarr/bazarr-config:/config
      - /mnt/nas/othermedia:/data
    networks:
      - arr
      - traefik
    labels:
      traefik.enable: true
      traefik.http.routers.bazarr.rule: Host(`bazarr.74services.net`)
      glance.name: Bazarr
      glance.id: bazarr
      glance.category: Arr
      glance.icon: sh:bazarr
      glance.description: Subtitle Management
      glance.url: https://bazarr.74services.net

  seerr:
    image: ghcr.io/seerr-team/seerr:develop@sha256:a05413ab39b25e418b3cec7f45962bccc69e75bf5b581f49c22053014f3bd626
    init: true
    environment:
      LOG_LEVEL: debug
      TZ: Europe/London
      PORT: 5055 #optional
    networks:
      - traefik
      - arr
    volumes:
      - /mnt/docker-data/mediarr/seerr-config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: "no"
    labels:
      traefik.enable: true
      traefik.http.routers.seerr.rule: Host(`seerr.74services.net`)
      glance.name: Seerr
      glance.id: seerr
      glance.category: Arr
      glance.icon: sh:seerr
      glance.description: Media Requests
      glance.url: https://seerr.74services.net

  bindery:
    image: ghcr.io/vavallee/bindery:latest@sha256:e34e37d91f54f5ae5cbdd7a2910f415be0056b0ad7b0265bf8ac56f46de22b63
    user: 0:0
    networks:
      - traefik
      - arr
    volumes:
      - /mnt/docker-data/mediarr/bindery-config:/config
      - /mnt/nas/othermedia/media/books:/books
      - /mnt/nas/othermedia/downloads:/downloads
    environment:
      - BINDERY_LOG_LEVEL=info
    restart: "no"
    labels:
      traefik.enable: true
      traefik.http.routers.bindery.rule: Host(`bindery.74services.net`)
      glance.name: Bindery
      glance.id: bindery
      glance.category: Arr
      glance.icon: sh:bindery
      glance.description: Book Management
      glance.url: https://bindery.74services.net

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: ${LOG_FILE:-none}
      LOG_HTML: ${LOG_HTML:-false}
      CAPTCHA_SOLVER: ${CAPTCHA_SOLVER:-none}
      TZ: Europe/London
    network_mode: 'service:vpn'
    depends_on:
      - vpn
    volumes:
      - /mnt/docker-data/mediarr/flaresolver-config:/config
    restart: "no"

networks:
  traefik:
    external: true
  arr: