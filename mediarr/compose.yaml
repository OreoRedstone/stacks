services:
  vpn:
    image: qmcgaw/gluetun:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file: .env
    environment:
      TZ: Europe/London
    ports:
      - 8112:8112 # deluge web UI Port
      - 58846:58846
      # - 6881:6881 # more deluge
    dns:
      - 1.1.1.1
    #   - 9.9.9.9
    networks:
      - traefik
      - arr
    labels:
      traefik.enable: true
      traefik.http.routers.prowlarr.rule: Host(`prowlarr.74services.net`)
      traefik.http.services.prowlarr.loadbalancer.server.port: 9696
      glance.parent: deluge
      glance.name: Gluetun
      glance.category: Arr

  deluge:
    image: lscr.io/linuxserver/deluge:latest@sha256:33a939576f7ecfc1227db1a0cb2afce030ce983e620ec9d93c956e3700e21fe9
    restart: unless-stopped
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/London
    volumes:
      - /mnt/docker-data/mediarr/deluge-config:/config
      - /mnt/nas/othermedia/downloads:/data/downloads
    network_mode: 'service:vpn'
    depends_on:
      - vpn
    labels:
      glance.name: Deluge
      glance.id: deluge
      glance.category: Arr
      glance.icon: sh:deluge
      glance.description: Media Acquisition
      glance.url: http://192.168.0.100:8112

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest@sha256:1295cff29d10b486c0d8324d1559a552140a5932bf8b3d87e398654414f63f92
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/London
    volumes:
      - /mnt/docker-data/mediarr/prowlarr-config:/config
    restart: unless-stopped
    network_mode: 'service:vpn'
    depends_on:
      - vpn
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    labels:
      glance.name: Prowlarr
      glance.id: prowlarr
      glance.category: Arr
      glance.icon: sh:prowlarr
      glance.description: Media Indexing
      glance.url: https://prowlarr.74services.net

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest@sha256:c19aa4ecdf03d73e1d5c901da33744cb7eb4d921f89bafed1ca264601d7fa224
    restart: unless-stopped
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/London
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/docker-data/mediarr/sonarr-config:/config
      - /mnt/nas/othermedia:/data
    networks:
      - arr
      - traefik
    labels:
      traefik.enable: true
      traefik.http.routers.sonarr.rule: Host(`sonarr.74services.net`)
      glance.name: Sonarr
      glance.id: sonarr
      glance.category: Arr
      glance.icon: sh:sonarr
      glance.description: Show Management
      glance.url: https://sonarr.74services.net

  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:119aaa4a4f7349bcd2a136c5373a0d7925b5479915c7dfe0c0ad352db2a6d438
    restart: unless-stopped
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/London
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/docker-data/mediarr/radarr-config:/config
      - /mnt/nas/othermedia:/data
    networks:
      - arr
      - traefik
    labels:
      traefik.enable: true
      traefik.http.routers.radarr.rule: Host(`radarr.74services.net`)
      glance.name: Radarr
      glance.id: radarr
      glance.category: Arr
      glance.icon: sh:radarr
      glance.description: Film Management
      glance.url: https://radarr.74services.net

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest@sha256:2e4cdc7c8d5fa36915f446a29976ee01d3f9cc9722b8530a09121c76fbabef55
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/London
    volumes:
      - /mnt/docker-data/mediarr/lidarr-config:/config
      - /mnt/nas/othermedia:/data
    networks:
      - arr
      - traefik
    restart: unless-stopped
    labels:
      traefik.enable: true
      traefik.http.routers.lidarr.rule: Host(`lidarr.74services.net`)
      glance.name: Lidarr
      glance.id: lidarr
      glance.category: Arr
      glance.icon: sh:lidarr
      glance.description: Music Management
      glance.url: https://lidarr.74services.net
      
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest@sha256:ac284d3fda9ee7da8b15197dc51f0d7a2a1da98549bee99a3d924d3e94a5e7ed
    restart: unless-stopped
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/London
      UMASK_SET: 022
    volumes:
      - /mnt/docker-data/mediarr/bazarr-config:/config
      - /mnt/nas/othermedia:/data
    networks:
      - arr
      - traefik
    labels:
      traefik.enable: true
      traefik.http.routers.bazarr.rule: Host(`bazarr.74services.net`)
      glance.name: Bazarr
      glance.id: bazarr
      glance.category: Arr
      glance.icon: sh:bazarr
      glance.description: Subtitle Management
      glance.url: https://bazarr.74services.net

  seerr:
    image: ghcr.io/seerr-team/seerr:develop@sha256:d303cd1c7bb8bcd4ef46ec0978a4c90e886973f5d02d8a586e5438ea6f66816a
    init: true
    environment:
      LOG_LEVEL: debug
      TZ: Europe/London
      PORT: 5055 #optional
    networks:
      - traefik
      - arr
    volumes:
      - /mnt/docker-data/mediarr/seerr-config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    labels:
      traefik.enable: true
      traefik.http.routers.seerr.rule: Host(`seerr.74services.net`)
      glance.name: Seerr
      glance.id: seerr
      glance.category: Arr
      glance.icon: sh:seerr
      glance.description: Media Requests
      glance.url: https://seerr.74services.net

  bindery:
    image: ghcr.io/vavallee/bindery:latest
    user: 0:0
    networks:
      - traefik
      - arr
    volumes:
      - /mnt/docker-data/mediarr/bindery-config:/config
      - /mnt/nas/othermedia/media/books:/books
      - /mnt/nas/othermedia/downloads:/downloads
    environment:
      - BINDERY_LOG_LEVEL=info
    restart: unless-stopped
    labels:
      traefik.enable: true
      traefik.http.routers.bindery.rule: Host(`bindery.74services.net`)
      glance.name: Bindery
      glance.id: bindery
      glance.category: Arr
      glance.icon: sh:bindery
      glance.description: Book Management
      glance.url: https://bindery.74services.net

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: ${LOG_FILE:-none}
      LOG_HTML: ${LOG_HTML:-false}
      CAPTCHA_SOLVER: ${CAPTCHA_SOLVER:-none}
      TZ: Europe/London
    network_mode: 'service:vpn'
    depends_on:
      - vpn
    volumes:
      - /mnt/docker-data/mediarr/flaresolver-config:/config
    restart: unless-stopped

networks:
  traefik:
    external: true
  arr: