services:
  vpn:
    image: qmcgaw/gluetun:latest@sha256:5cedd587404f96202060385d541faa4a73e51544ea098ec8d31c614f4d9c6ee0
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file: .env
    environment:
      TZ: Europe/London
    ports:
      - 10.44.0.2:8112:8112 # deluge web UI Port
      - 10.44.0.2:58846:58846
      # - 6881:6881 # more deluge
    dns:
      - 1.1.1.1
    #   - 9.9.9.9
    networks:
      - traefik
      - arr
    labels:
      traefik.enable: true
      traefik.http.routers.prowlarr.rule: Host(`prowlarr.74services.net`)
      traefik.http.routers.prowlarr.middlewares: arr-forwarded-https@file
      traefik.http.services.prowlarr.loadbalancer.server.port: 9696
      glance.parent: deluge
      glance.name: Gluetun
      glance.category: Arr

  deluge:
    image: lscr.io/linuxserver/deluge:latest@sha256:9505c64720afa9e5f0ac1576e660dd6d1e9d4a6733b791f4821e8f496f19f41f
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/London
    volumes:
      - /mnt/docker-data/mediarr/deluge-config:/config
      - /mnt/nas/othermedia/downloads:/data/downloads
    network_mode: 'service:vpn'
    depends_on:
      - vpn
    labels:
      homelab.canonical-route: http://10.44.0.2:8112
      glance.name: Deluge
      glance.id: deluge
      glance.category: Arr
      glance.icon: sh:deluge
      glance.description: Media Acquisition
      glance.url: http://10.44.0.2:8112

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest@sha256:f2b26429893d4c4cb71941b7ee50b1bdecd9d5f9f9e02d5410615e9f4f7c8d95
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/London
    volumes:
      - /mnt/docker-data/mediarr/prowlarr-config:/config
    restart: unless-stopped
    network_mode: 'service:vpn'
    depends_on:
      - vpn
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    labels:
      glance.name: Prowlarr
      glance.id: prowlarr
      glance.category: Arr
      glance.icon: sh:prowlarr
      glance.description: Media Indexing
      glance.url: https://prowlarr.74services.net
      homelab.canonical-route: https://prowlarr.74services.net

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest@sha256:a5c1a5fecbef946927ab90ad68df319ac5fe644057e5fc18cd993f01ac07b2b2
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/London
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/docker-data/mediarr/sonarr-config:/config
      - /mnt/nas/othermedia:/data
    networks:
      - arr
      - traefik
    labels:
      traefik.enable: true
      traefik.http.routers.sonarr.rule: Host(`sonarr.74services.net`)
      traefik.http.routers.sonarr.middlewares: arr-forwarded-https@file
      homelab.canonical-route: https://sonarr.74services.net
      glance.name: Sonarr
      glance.id: sonarr
      glance.category: Arr
      glance.icon: sh:sonarr
      glance.description: Show Management
      glance.url: https://sonarr.74services.net

  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:adb6c09d6b729ea5e642c99cea35af72702ef476bf4763f153299ac5db9f0b4f
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/London
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/docker-data/mediarr/radarr-config:/config
      - /mnt/nas/othermedia:/data
    networks:
      - arr
      - traefik
    labels:
      traefik.enable: true
      traefik.http.routers.radarr.rule: Host(`radarr.74services.net`)
      traefik.http.routers.radarr.middlewares: arr-forwarded-https@file
      homelab.canonical-route: https://radarr.74services.net
      glance.name: Radarr
      glance.id: radarr
      glance.category: Arr
      glance.icon: sh:radarr
      glance.description: Film Management
      glance.url: https://radarr.74services.net

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest@sha256:044d616beb43c5e7810991242c6a9c42b93ff238c8c0850684939634ea751208
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/London
    volumes:
      - /mnt/docker-data/mediarr/lidarr-config:/config
      - /mnt/nas/othermedia:/data
    networks:
      - arr
      - traefik
    restart: unless-stopped
    labels:
      traefik.enable: true
      traefik.http.routers.lidarr.rule: Host(`lidarr.74services.net`)
      traefik.http.routers.lidarr.middlewares: arr-forwarded-https@file
      homelab.canonical-route: https://lidarr.74services.net
      glance.name: Lidarr
      glance.id: lidarr
      glance.category: Arr
      glance.icon: sh:lidarr
      glance.description: Music Management
      glance.url: https://lidarr.74services.net
      
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest@sha256:762f802274598da27255b2e5778f262b2b71b355a23e3812d9ee1520f8dbe37c
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/London
      UMASK_SET: 022
    volumes:
      - /mnt/docker-data/mediarr/bazarr-config:/config
      - /mnt/nas/othermedia:/data
    networks:
      - arr
      - traefik
    labels:
      traefik.enable: true
      traefik.http.routers.bazarr.rule: Host(`bazarr.74services.net`)
      traefik.http.routers.bazarr.middlewares: arr-forwarded-https@file
      homelab.canonical-route: https://bazarr.74services.net
      glance.name: Bazarr
      glance.id: bazarr
      glance.category: Arr
      glance.icon: sh:bazarr
      glance.description: Subtitle Management
      glance.url: https://bazarr.74services.net

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:2.10.8@sha256:ec444338a67e429a20f6eef938e1ed771ce357ed4831765026096061a09bbbb7
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/London
      PORT: 11011
    ports:
      - 10.44.0.2:11011:11011
    volumes:
      - /mnt/docker-data/mediarr/cleanuparr-config:/config
      - /mnt/nas/othermedia:/data
    networks:
      - arr
    depends_on:
      - vpn
      - radarr
      - sonarr

  seerr:
    image: ghcr.io/seerr-team/seerr:develop@sha256:6dadbb17a15d287e694920e4583b90e0ad3b2b59ae58e3bc8373b392b6a4c7d9
    init: true
    environment:
      LOG_LEVEL: debug
      TZ: Europe/London
      PORT: 5055 #optional
    networks:
      - traefik
      - arr
    volumes:
      - /mnt/docker-data/mediarr/seerr-config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    labels:
      traefik.enable: true
      traefik.http.routers.seerr.rule: Host(`seerr.74services.net`)
      homelab.canonical-route: https://seerr.74services.net
      glance.name: Seerr
      glance.id: seerr
      glance.category: Arr
      glance.icon: sh:seerr
      glance.description: Media Requests
      glance.url: https://seerr.74services.net

  bindery:
    image: ghcr.io/vavallee/bindery:latest@sha256:79dd7ee9b90563f44fba6392a080a356e73f1cba932a9f44e306aaf348cdfa79
    user: 1000:1000
    networks:
      - traefik
      - arr
    volumes:
      - /mnt/docker-data/mediarr/bindery-config:/config
      - /mnt/nas/othermedia/media/books:/books
      - /mnt/nas/othermedia/downloads:/downloads
    environment:
      - BINDERY_LOG_LEVEL=info
    restart: unless-stopped
    labels:
      traefik.enable: true
      traefik.http.routers.bindery.rule: Host(`bindery.74services.net`)
      homelab.canonical-route: https://bindery.74services.net
      glance.name: Bindery
      glance.id: bindery
      glance.category: Arr
      glance.icon: sh:bindery
      glance.description: Book Management
      glance.url: https://bindery.74services.net

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: ${LOG_FILE:-none}
      LOG_HTML: ${LOG_HTML:-false}
      CAPTCHA_SOLVER: ${CAPTCHA_SOLVER:-none}
      TZ: Europe/London
    network_mode: 'service:vpn'
    depends_on:
      - vpn
    volumes:
      - /mnt/docker-data/mediarr/flaresolver-config:/config
    restart: unless-stopped

  exportarr-sonarr:
    image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
    command: [sonarr]
    restart: unless-stopped
    environment:
      PORT: 9707
      URL: http://sonarr:8989
      API_KEY: ${SONARR_API_KEY:?required}
      LOG_LEVEL: info
    networks:
      - arr
      - monitoring

  exportarr-radarr:
    image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
    command: [radarr]
    restart: unless-stopped
    environment:
      PORT: 9707
      URL: http://radarr:7878
      API_KEY: ${RADARR_API_KEY:?required}
      LOG_LEVEL: info
    networks:
      - arr
      - monitoring

  exportarr-lidarr:
    image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
    command: [lidarr]
    restart: unless-stopped
    environment:
      PORT: 9707
      URL: http://lidarr:8686
      API_KEY: ${LIDARR_API_KEY:?required}
      LOG_LEVEL: info
    networks:
      - arr
      - monitoring

  exportarr-prowlarr:
    image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
    command: [prowlarr]
    restart: unless-stopped
    environment:
      PORT: 9707
      URL: http://vpn:9696
      API_KEY: ${PROWLARR_API_KEY:?required}
      LOG_LEVEL: info
    networks:
      - arr
      - monitoring

  exportarr-bazarr:
    image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
    command: [bazarr]
    restart: unless-stopped
    environment:
      PORT: 9707
      URL: http://bazarr:6767
      API_KEY: ${BAZARR_API_KEY:?required}
      LOG_LEVEL: info
    networks:
      - arr
      - monitoring

networks:
  traefik:
    external: true
  arr:
  monitoring:
    external: true
