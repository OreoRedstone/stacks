services:
  vpn:
    image: qmcgaw/gluetun@sha256:7b1dafa3d25cfd891deae52c7973c499f619f7d8eac52fad84f9aa1e5e6e01ca
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file: .env
    environment:
      TZ: Europe/London
    ports:
      - 8112:8112 # deluge web UI Port
      - 58846:58846
      # - 6881:6881 # more deluge
    dns:
      - 1.1.1.1
      - 9.9.9.9
    networks:
      - arr
      # - traefik
    labels:
      # traefik.enable: true
      # traefik.http.routers.deluge.rule: Host(`deluge.74services.net`)
      # traefik.http.services.deluge.loadbalancer.server.port: 8112
      glance.parent: deluge
      glance.name: Gluetun
      glance.category: Arr
      
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest@sha256:7962759d99d7e125e108e0f5e7f3cdbcd36161776d058d1d9b7153b92ef1af9e
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: ${LOG_FILE:-none}
      LOG_HTML: ${LOG_HTML:-false}
      CAPTCHA_SOLVER: ${CAPTCHA_SOLVER:-none}
      TZ: Europe/London
    # ports:
    #   - "${PORT:-8191}:8191"
    networks:
      - arr
    volumes:
      - flaresolver-config:/config
    restart: unless-stopped

  deluge:
    image: lscr.io/linuxserver/deluge:latest@sha256:448ed924f3479ae175c936c9693b4c4df52ebcb193e05d805c9f16c88112fe45
    restart: unless-stopped
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/London
    volumes:
      - deluge-config:/config
      - /mnt/nas/othermedia/downloads:/data/downloads
    network_mode: 'service:vpn'
    depends_on:
      - vpn
    labels:
      glance.name: Deluge
      glance.id: deluge
      glance.category: Arr
      glance.icon: sh:deluge
      glance.description: Media Acquisition
      glance.url: http://192.168.0.100:8112

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest@sha256:67a8aaedcfd6989f3030b937a6a07007310b1dfc7ee8df16d2cbfa48d1c1158c
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/London
    volumes:
      - prowlarr-config:/config
    restart: unless-stopped
    networks:
      - arr
      - traefik
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    labels:
      traefik.enable: true
      traefik.http.routers.prowlarr.rule: Host(`prowlarr.74services.net`)
      glance.name: Prowlarr
      glance.id: prowlarr
      glance.category: Arr
      glance.icon: sh:prowlarr
      glance.description: Media Indexing
      glance.url: https://prowlarr.74services.net

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest@sha256:8b9f2138ec50fc9e521960868f79d2ad0d529bc610aef19031ea8ff80b54c5e0
    restart: unless-stopped
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/London
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - sonarr-config:/config
      - /mnt/nas/othermedia:/data
    networks:
      - arr
      - traefik
    labels:
      traefik.enable: true
      traefik.http.routers.sonarr.rule: Host(`sonarr.74services.net`)
      glance.name: Sonarr
      glance.id: sonarr
      glance.category: Arr
      glance.icon: sh:sonarr
      glance.description: Show Management
      glance.url: https://sonarr.74services.net

  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:6c0948b42c149e36bb3dbc0b64d36c77b2d3c9dccf1b424c4f72af1e57ba0c21
    restart: unless-stopped
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/London
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - radarr-config:/config
      - /mnt/nas/othermedia:/data
    networks:
      - arr
      - traefik
    labels:
      traefik.enable: true
      traefik.http.routers.radarr.rule: Host(`radarr.74services.net`)
      glance.name: Radarr
      glance.id: radarr
      glance.category: Arr
      glance.icon: sh:radarr
      glance.description: Film Management
      glance.url: https://radarr.74services.net

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest@sha256:ede2bb17350cc97a0d3f24389aa91803f655eac29aa022c77a71f4a61cc621e4
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/London
    volumes:
      - lidarr-config:/config
      - /mnt/nas/othermedia:/data
    networks:
      - arr
      - traefik
    restart: unless-stopped
    labels:
      traefik.enable: true
      traefik.http.routers.lidarr.rule: Host(`lidarr.74services.net`)
      glance.name: Lidarr
      glance.id: lidarr
      glance.category: Arr
      glance.icon: sh:lidarr
      glance.description: Music Management
      glance.url: https://lidarr.74services.net
      
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest@sha256:001875e61839c8a50743f0bc0fa4da2a55ed8a038b9b5ed0dd2c663dd3d0bfc7
    restart: unless-stopped
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/London
      UMASK_SET: 022
    volumes:
      - bazarr-config:/config
      - /mnt/nas/othermedia:/data
    networks:
      - arr
      - traefik
    labels:
      traefik.enable: true
      traefik.http.routers.bazarr.rule: Host(`bazarr.74services.net`)
      glance.name: Bazarr
      glance.id: bazarr
      glance.category: Arr
      glance.icon: sh:bazarr
      glance.description: Subtitle Management
      glance.url: https://bazarr.74services.net

  seerr:
    image: ghcr.io/seerr-team/seerr:sha-8bbe786@sha256:ffd4995fc11f65f23705de19c4f9206eaeec405c2bdc7ac3e6977a1520a09c5a
    init: true
    environment:
      LOG_LEVEL: debug
      TZ: Europe/London
      PORT: 5055 #optional
    networks:
      - traefik
      - arr
    volumes:
      - seerr-config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    labels:
      traefik.enable: true
      traefik.http.routers.seer.rule: Host(`seerr.74services.net`)
      glance.name: Seerr
      glance.id: seerr
      glance.category: Arr
      glance.icon: sh:seerr
      glance.description: Media Requests
      glance.url: https://seerr.74services.net

  seed-pauser:
    image: oreoredstone/seed-pauser
    build: ./seed-pauser
    ports:
      - 80:80
    environment:
      DELUGE_PASSWORD: ${DELUGE_PASSWORD}
      DELUGE_URL: ${DELUGE_URL}

volumes:
  deluge-config:
  prowlarr-config:
  sonarr-config:
  radarr-config:
  lidarr-config:
  bazarr-config:
  seerr-config:
  flaresolver-config:

networks:
  traefik:
    external: true
  arr: