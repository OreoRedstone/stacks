services:
  # Note: MariaDB is external service. You can find more information about the configuration here:
  # https://hub.docker.com/_/mariadb
  db:
    # Note: Check the recommend version here: https://docs.nextcloud.com/server/latest/admin_manual/installation/system_requirements.html#server
    image: mariadb:11.8@sha256:efb4959ef2c835cd735dbc388eb9ad6aab0c78dd64febcd51bc17481111890c4
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED
    volumes:
      - /mnt/docker-data/nextcloud/db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
    labels:
      glance.parent: nextcloud
      glance.name: MariaDB
      glance.category: Media

  # Note: Redis is an external service. You can find more information about the configuration here:
  # https://hub.docker.com/_/redis
  # redis:
  #   image: redis:8.2-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
  #   restart: unless-stopped
  #   labels:
  #     glance.parent: nextcloud
  #     glance.name: Redis
  #     glance.category: Media

  app:
    image: nextcloud:34.0-apache@sha256:b52f7bc0e496f227b0e85e3b88571a42c68b6245ccde29d577e733227715dcf5
    restart: unless-stopped
    user: 1000:1000
    depends_on:
      - redis
      - db
      - collabora
    volumes:
      - /mnt/docker-data/nextcloud/nextcloud-data:/var/www/html
    networks:
      - traefik
      - default
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_HOST: db
      TRUSTED_PROXIES: traefik
      OVERWRITEHOST: cloud.74services.net 
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://cloud.74services.net
      ALLOW_EMBEDDING: true
    labels:
      traefik.enable: true
      traefik.http.routers.nextcloud.rule: Host(`cloud.74services.net`)
      glance.name: Nextcloud
      glance.id: nextcloud
      glance.category: Media
      glance.icon: sh:nextcloud
      glance.url: https://cloud.74services.net
      glance.description: Cloud Management
    
  collabora:
    image: collabora/code:26.04.2.2.1@sha256:f8a308bcd12ad09babcd635662b512776b0749fc04c9a63db568865bd195b4d9
    restart: unless-stopped
    networks:
      - traefik
      - default
    environment:
      - aliasgroup1=https://cloud.74services.net
      - "extra_params=--o:ssl.enable=false --o:ssl.termination=true"
    labels:
      traefik.enable: true
      traefik.http.routers.collabora.rule: Host(`collabora.74services.net`)
      glance.parent: nextcloud
      glance.name: Collabora
      glance.category: Media

networks:
  traefik:
    external: true