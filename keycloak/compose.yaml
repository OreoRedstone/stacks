services:
  app:
    image: quay.io/keycloak/keycloak:26.3.5-0@sha256:357829ec7c4693397533035092ad13b0644bcc95ded311f33a3738c4d9e9bdba
    networks:
      - traefik
    command:
      start --http-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: temp-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: temp-admin
      DEBUG: true
    labels:
      traefik.enable: true
      traefik.http.routers.keycloak.rule: Host(`keycloak.74services.net`)
      glance.name: Keycloak
      glance.id: keycloak
      glance.category: Security
      glance.icon: sh:keycloak
      glance.url: https://keycloak.74services.net
      glance.description: Identity and Access Management

networks:
  traefik:
    external: true
