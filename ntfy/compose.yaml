services:
  ntfy:
    image: binwiederhier/ntfy:v2.27@sha256:f2419f405127afa868f10985c1a41449e673477cee1eb19994339a5ae8b592e7
    command:
      - serve
    environment:
      - TZ=UTC    # optional: set desired timezone
    user: 1000:1000 # optional: replace with your own user/group or uid/gid
    networks:
      - traefik
    volumes:
      - cache:/var/cache/ntfy
      - ./server.yml:/etc/ntfy/server.yml
    healthcheck: # optional: remember to adapt the host:port to your environment
        test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
        interval: 60s
        timeout: 10s
        retries: 3
        start_period: 40s
    restart: unless-stopped
    labels:
      traefik.enable: true
      traefik.http.routers.ntfy.rule: Host(`ntfy.74services.net`)
      glance.name: Ntfy
      glance.id: ntfy
      glance.category: Management
      glance.icon: sh:ntfy
      glance.url: https://ntfy.74services.net
      glance.description: Notification Server

volumes:
  cache:

networks:
  traefik:
    external: true