services:
  ntfy:
    image: binwiederhier/ntfy:latest@sha256:5a051798d14138c3ecb12c038652558ab6a077e1aceeb867c151cbf5fa8451ef
    container_name: ntfy
    command:
      - serve
    environment:
      - TZ=UTC    # optional: set desired timezone
    user: 1000:1000 # optional: replace with your own user/group or uid/gid
    volumes:
      - cache:/var/cache/ntfy
      - ./server.yml:/etc/ntfy/server.yml
    networks:
      - nginx-proxy
    healthcheck: # optional: remember to adapt the host:port to your environment
        test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
        interval: 60s
        timeout: 10s
        retries: 3
        start_period: 40s
    restart: unless-stopped
    labels:
      - homepage.group=Monitoring
      - homepage.name=Ntfy
      - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/png/ntfy.png
      - homepage.href=https://ntfy.74services.net
      - homepage.description=Notification System

volumes:
  cache:

networks:
  nginx-proxy:
    external: true