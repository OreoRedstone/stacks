- name: Home
  # Optionally, if you only have a single page you can hide the desktop navigation for a cleaner look
  # hide-desktop-navigation: true
  columns:
    - size: small
      widgets:
        - type: calendar
          first-day-of-week: monday

        - type: monitor
          cache: 1m
          title: Services
          sites:
            - title: Jellyfin
              url: https://stream.74services.net
              icon: sh:jellyfin
            - title: Nextcloud
              url: https://cloud.74services.net
              icon: sh:nextcloud
            - title: Immich
              url: https://photos.74services.net
              icon: sh:immich
            - title: Ntfy
              url: https://ntfy.74services.net
              icon: sh:ntfy
            - title: Vaultwarden
              url: https://vault.74services.net
              icon: sh:vaultwarden

    - size: full
      widgets:
        - type: split-column
          widgets:
            - type: docker-containers
              title: Media
              category: Media
              sock-path: http://docker-socket-proxy:2375

            - type: docker-containers
              title: Mediarr
              category: Arr
              sock-path: http://docker-socket-proxy:2375

            - type: docker-containers
              title: Management
              category: Management
              sock-path: http://docker-socket-proxy:2375

            - type: docker-containers
              title: Security
              category: Security
              sock-path: http://docker-socket-proxy:2375

            - type: docker-containers
              title: Gaming
              category: Gaming
              sock-path: http://docker-socket-proxy:2375
              
            - type: docker-containers
              title: Networking
              category: Networking
              sock-path: http://docker-socket-proxy:2375

        - type: rss
          title: News
          style: horizontal-cards
          feeds:
            - url: https://blog.computationalcomplexity.org/feeds/posts/default?alt=rss
              title: Computational Complexity Blog


    - size: small
      widgets:
        - type: repository
          repository: OreoRedstone/stacks
          token: ${GH_TOKEN}
          pull-requests-limit: 5
          issues-limit: 3
          commits-limit: 3

        - type: releases
          show-source-icon: true
          token: ${GH_TOKEN}
          repositories:
            - immich-app/immich
            - Docile-Alligator/Infinity-For-Reddit
            - SpectralPack/Cryptid
