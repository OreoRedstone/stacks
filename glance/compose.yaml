services:
  app:
    image: glanceapp/glance:v0.8.7@sha256:bc5a392672c1ec8823c50b61f3bd4b7e5acc34fcbb8477862577b3af1c633875
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
      - /etc/localtime:/etc/localtime:ro
    networks:
      - docker-socket-proxy
    ports:
      - 10.44.0.2:80:8080
    env_file: .env
    labels:
      homelab.canonical-route: http://10.44.0.2
      glance.name: Glance
      glance.id: glance
      glance.category: Management
      glance.icon: sh:glance
      glance.url: http://10.44.0.2
      glance.description: Dashboard

networks:
  docker-socket-proxy:
    external: true
