services:
  app:
    image: glanceapp/glance:v0.8.4@sha256:6df86a7e8868d1eda21f35205134b1962c422957e42a0c44d4717c8e8f741b1a
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
      - /etc/localtime:/etc/localtime:ro
      # Optionally, also mount docker socket if you want to use the docker containers widget
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 80:8080
    env_file: .env
    labels:
      glance.name: Glance
      glance.id: glance
      glance.catergory: Management
      glance.icon: sh:glance
      glance.url: http://192.168.0.100
      glance.description: Dashboard
