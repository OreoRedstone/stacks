services:
  app:
    image: glanceapp/glance:v0.8.5@sha256:32ab73d80f2b8b5fb0735b0431deb36b93fbb6b2fb43592449b0178c8b83e350
    restart: "no"
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
      - /etc/localtime:/etc/localtime:ro
    networks:
      - docker-socket-proxy
    ports:
      - 10.44.0.2:80:8080
    env_file: .env
    labels:
      glance.name: Glance
      glance.id: glance
      glance.category: Management
      glance.icon: sh:glance
      glance.url: http://10.44.0.2
      glance.description: Dashboard

networks:
  docker-socket-proxy:
    external: true
