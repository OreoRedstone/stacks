services:
  app:
    image: glanceapp/glance:v0.8.8@sha256:4d7445bc7971836858ffddee5d7501f1efbabb6e694a45b1dde1a789bb1943bb
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
      - /etc/localtime:/etc/localtime:ro
    networks:
      - docker-socket-proxy
    ports:
      - 10.44.0.2:80:8080
    env_file: .env
    labels:
      homelab.canonical-route: http://10.44.0.2
      glance.name: Glance
      glance.id: glance
      glance.category: Management
      glance.icon: sh:glance
      glance.url: http://10.44.0.2
      glance.description: Dashboard

networks:
  docker-socket-proxy:
    external: true
