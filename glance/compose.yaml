services:
  app:
    image: glanceapp/glance:v0.8.6@sha256:9dfb09470b207dcb67ac715994bdb1929374ba3f9c0d7df7462c24adf10fd073
    restart: "no"
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
      - /etc/localtime:/etc/localtime:ro
    networks:
      - docker-socket-proxy
    ports:
      - 10.44.0.2:80:8080
    env_file: .env
    labels:
      homelab.canonical-route: http://10.44.0.2
      glance.name: Glance
      glance.id: glance
      glance.category: Management
      glance.icon: sh:glance
      glance.url: http://10.44.0.2
      glance.description: Dashboard

networks:
  docker-socket-proxy:
    external: true
