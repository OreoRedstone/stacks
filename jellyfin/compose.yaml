services:
  app:
    image: jellyfin/jellyfin:10.10@sha256:7ae36aab93ef9b6aaff02b37f8bb23df84bb2d7a3f6054ec8fc466072a648ce2
    user: 0:0
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - /mnt/nas/media/films:/media/films
      - /mnt/nas/media/shows:/media/shows
      - /mnt/nas/media/Music:/media/music
      - /mnt/nas/othermedia/media:/othermedia
    networks:
      - traefik
    restart: 'unless-stopped'
    # Optional - alternative address used for autodiscovery
    # environment:
    #   - JELLYFIN_PublishedServerUrl=https://stream.74services.net
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    # extra_hosts:
    #   - 'host.docker.internal:host-gateway'
    labels:
      traefik.enable: true
      traefik.http.routers.jellyfin.rule: Host(`stream.74services.net`)
      glance.name: Jellyfin
      glance.id: jellyfin
      glance.category: Media
      glance.icon: sh:jellyfin
      glance.url: https://stream.74services.net
      glance.description: Movies and TV
  wizarr:
    image: ghcr.io/wizarrrr/wizarr:v2025.9.2@sha256:ec7bff0536093154321ad8ecb8ee4b34a2df01579e3b37f7d3add86924066d64
    networks:
      - traefik
    volumes:
      - wizarr-db:/data/database
    environment:
      - PUID=1000 #Set UID
      - PGID=1000 #Set GID
      - DISABLE_BUILTIN_AUTH=false #Set to true ONLY if you are using another auth provider (Authelia, Authentik, etc)
      - TZ=Europe/London #Set your timezone here
    labels:
      traefik.enable: true
      traefik.http.routers.wizarr.rule: Host(`wizarr.74services.net`)
      glance.name: Wizarr
      glance.id: wizarr
      glance.category: Media
      glance.icon: sh:wizarr
      glance.url: https://wizarr.74services.net
      glance.description: Setup for Jellyfin

volumes:
  jellyfin-cache:
  jellyfin-config:
  wizarr-db:

networks:
  traefik:
    external: true