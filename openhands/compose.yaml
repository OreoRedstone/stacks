services:
  app:
    # Pin to the reviewed release; Renovate can propose future updates.
    image: ghcr.io/openhands/agent-canvas:1.6.1
    restart: unless-stopped
    environment:
      AGENT_CANVAS_DISABLE_TELEMETRY: "1"
      # Avoid Codex ACP's full-access mode, which requests approval_policy=Never.
      # Managed ChatGPT policies may require approval-on-request instead.
      INITIAL_AGENT_MODE: agent
      # Set strong, unique values in the Komodo stack environment.
      LOCAL_BACKEND_API_KEY: ${LOCAL_BACKEND_API_KEY:?Set LOCAL_BACKEND_API_KEY in the stack environment}
      OH_SECRET_KEY: ${OH_SECRET_KEY:?Set OH_SECRET_KEY in the stack environment}
    volumes:
      - /mnt/docker-data/openhands/data:/home/openhands/.openhands
      # Dedicated workspace; do not mount the live stacks checkout or host data.
      - /mnt/docker-data/openhands/projects:/projects
    ports:
      - 10.44.0.2:8000:8000
    labels:
      glance.name: OpenHands
      glance.id: openhands
      glance.category: Management
      glance.icon: sh:openhands
      glance.url: http://10.44.0.2:8000/canvas
      glance.description: Agent Canvas
