services:
  app:
    image: ghcr.io/haveagitgat/tdarr:2.47.01@sha256:d3a6c63255e63a1c90f2db86c68947c547b0b477b1cbef6b3102ca6d1077675a
    restart: unless-stopped
    ports:
      - 8265:8265 # webUI port
      - 8266:8266 # server port
    environment:
      - TZ=Europe/London
      - PUID=0
      - PGID=0
      - UMASK_SET=002
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - ffmpegVersion=7
      - nodeName=MyInternalNode
    volumes:
      - server:/app/server
      - ./configs:/app/configs
      # - ./logs:/app/logs
      - /mnt/nas/media:/media
      # - ./temp:/temp
    labels:
      glance.name: Tdarr
      glance.id: tdarr
      glance.category: Media
      glance.icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/tdarr.png
      glance.url: http://192.168.0.100:8265
      glance.description: Video Transcoding

volumes:
  server: