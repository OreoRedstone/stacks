services:
  app:
    image: ghcr.io/haveagitgat/tdarr:2.86.01@sha256:45742f00e51a58553844c8b13d97e7ae9b2ee9a056bd8e5993d9a8282a45a23f
    restart: "no"
    ports:
      # - 8265:8265 # webUI port
      # - 8266:8266 # server port
    environment:
      - TZ=Europe/London
      - PUID=0
      - PGID=0
      - UMASK_SET=002
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - ffmpegVersion=7
      - nodeName=MyInternalNode
    volumes:
      - /mnt/docker-data/tdarr/server:/app/server
      - ./configs:/app/configs
      # - ./logs:/app/logs
      - /mnt/nas/media:/media
      # - ./temp:/temp
    labels:
      glance.name: Tdarr
      glance.id: tdarr
      glance.category: Media
      glance.icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/tdarr.png
      glance.url: http://192.168.0.100:8265
      glance.description: Video Transcoding
