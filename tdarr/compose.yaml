services:
  app:
    image: ghcr.io/haveagitgat/tdarr:2.84.01@sha256:93dd407f8a28b035b3ebece794bd3f489a9b07a810ca02b804adf72387888355
    restart: unless-stopped
    ports:
      - 8265:8265 # webUI port
      - 8266:8266 # server port
    environment:
      - TZ=Europe/London
      - PUID=0
      - PGID=0
      - UMASK_SET=002
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - ffmpegVersion=7
      - nodeName=MyInternalNode
    volumes:
      - /mnt/docker-data/tdarr/server:/app/server
      - ./configs:/app/configs
      # - ./logs:/app/logs
      - /mnt/nas/media:/media
      # - ./temp:/temp
    labels:
      glance.name: Tdarr
      glance.id: tdarr
      glance.category: Media
      glance.icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/tdarr.png
      glance.url: http://192.168.0.100:8265
      glance.description: Video Transcoding
