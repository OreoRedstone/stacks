services:
  app:
    image: ghcr.io/haveagitgat/tdarr:2.45.01@sha256:69d28aff66318ecc1c9496717c1731fbdbbfb8c0c4664a90bbb36747fbf279fe
    restart: unless-stopped
    ports:
      - 8265:8265 # webUI port
      - 8266:8266 # server port
    environment:
      - TZ=Europe/London
      - PUID=0
      - PGID=0
      - UMASK_SET=002
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - ffmpegVersion=7
      - nodeName=MyInternalNode
    volumes:
      - server:/app/server
      - ./configs:/app/configs
      # - ./logs:/app/logs
      - /mnt/nas/media:/media
      # - ./temp:/temp
    labels:
      glance.name: Tdarr
      glance.id: tdarr
      glance.category: Media
      glance.icon: sh:tdarr
      glance.url: http://192.168.0.100:8265
      glance.description: Video Transcoding

volumes:
  server: