http {
    ssl_certificate     /etc/letsencrypt/live/74services.net/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/74services.net/privkey.pem;

    server {
        listen 443 ssl default_server;

        server_name _;

        # allow large file uploads
        client_max_body_size 50000M;

        # set timeout
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout       600s;

        # enable websockets: http://nginx.org/en/docs/http/websocket.html
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        # proxy_redirect     off;

        # Set headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            proxy_pass http://192.168.0.100:9999;
        }
    }

    server {
        listen 443 ssl;

        server_name *.control.74services.net auth.74services.net;

        # allow large file uploads
        client_max_body_size 50000M;

        # set timeout
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout       600s;

        # enable websockets: http://nginx.org/en/docs/http/websocket.html
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        # proxy_redirect     off;

        # Set headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;


        location / {
            proxy_pass http://traefik;
        }
    }
}

events {}