services:
  traefik:
    image: traefik:v3.7@sha256:5203c3f39ca70de6790d964624e042463ffbd57715bc82be155cf224c0dd5144
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.network=traefik"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.dashboard.address=:8080"
      - "--api.dashboard=true"
      - "--providers.file.filename=/etc/traefik/dynamic.yaml"
    volumes:
      - ./dynamic.yaml:/etc/traefik/dynamic.yaml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      traefik:
        ipv4_address: 172.32.0.10
    ports:
      # - 4000:8080
      - 9999:80
    labels:
      glance.name: Traefik
      glance.id: traefik
      glance.category: Networking
      glance.icon: sh:traefik
      glance.description: Application Plane Proxy

networks:
  traefik:
    name: traefik
    ipam:
      config:
        - subnet: 172.32.0.0/16