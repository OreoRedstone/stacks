services:
  traefik:
    image: traefik:v3.7@sha256:b7b1b31e6440de0b1f7c4e0f6cf0a0f3f004866761d30c025fe00c80daaf7d9c
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
      - "--providers.docker.network=traefik"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
      # Nginx on the VPS terminates TLS and forwards the original request
      # scheme to Traefik. Trust only that proxy when accepting forwarded
      # headers so Traefik passes https through to backend applications.
      - "--entrypoints.web.forwardedHeaders.trustedIPs=10.44.0.1/32"
      - "--entrypoints.metrics.address=:8082"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--metrics.prometheus.addrouterslabels=true"
      - "--providers.file.filename=/etc/traefik/dynamic.yaml"
    volumes:
      - ./dynamic.yaml:/etc/traefik/dynamic.yaml:ro
    networks:
      - traefik
      - docker-socket-proxy
      - monitoring
    ports:
      - 9999:80
    labels:
      glance.name: Traefik
      glance.id: traefik
      glance.category: Networking
      glance.icon: sh:traefik
      glance.description: Application Plane Proxy

networks:
  traefik:
    name: traefik
    ipam:
      config:
        - subnet: 172.32.0.0/16
  monitoring:
    name: monitoring
  docker-socket-proxy:
    external: true
