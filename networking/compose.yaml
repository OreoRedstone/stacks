services:
  traefik:
    image: traefik:v3.7@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf
    container_name: traefik
    restart: "no"
    command:
      - "--providers.docker=true"
      - "--providers.docker.network=traefik"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.metrics.address=:8082"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--metrics.prometheus.addrouterslabels=true"
      - "--providers.file.filename=/etc/traefik/dynamic.yaml"
    volumes:
      - ./dynamic.yaml:/etc/traefik/dynamic.yaml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik
      - monitoring
    ports:
      - 9999:80
    labels:
      glance.name: Traefik
      glance.id: traefik
      glance.category: Networking
      glance.icon: sh:traefik
      glance.description: Application Plane Proxy

networks:
  traefik:
    name: traefik
    ipam:
      config:
        - subnet: 172.32.0.0/16
  monitoring:
    name: monitoring
