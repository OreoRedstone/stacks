services:
  traefik:
    image: traefik:v3.7@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
      - "--providers.docker.network=traefik"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.metrics.address=:8082"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--metrics.prometheus.addrouterslabels=true"
      - "--providers.file.filename=/etc/traefik/dynamic.yaml"
    volumes:
      - ./dynamic.yaml:/etc/traefik/dynamic.yaml
    networks:
      - traefik
      - docker-socket-proxy
      - monitoring
    ports:
      - 9999:80
    labels:
      glance.name: Traefik
      glance.id: traefik
      glance.category: Networking
      glance.icon: sh:traefik
      glance.description: Application Plane Proxy

networks:
  traefik:
    name: traefik
    ipam:
      config:
        - subnet: 172.32.0.0/16
  monitoring:
    name: monitoring
  docker-socket-proxy:
    external: true
