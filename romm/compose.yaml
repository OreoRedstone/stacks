services:
  app:
    image: rommapp/romm:latest
    restart: unless-stopped
    environment:
      DB_HOST: romm-db
      DB_NAME: romm
      DB_USER: romm-user
      DB_PASSWD: ${DB_PASSWORD}
      ROMM_AUTH_SECRET_KEY: ${AUTH_KEY}
      # SCREENSCRAPER_USER: # These are the recommended metadata providers
      # SCREENSCRAPER_PASSWORD: # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#screenscraper
      # RETROACHIEVEMENTS_API_KEY: # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#retroachievements
      # STEAMGRIDDB_API_KEY: # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#steamgriddb
      # HASHEOUS_API_ENABLED: true # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#hasheous
    volumes:
      - resources:/romm/resources # Resources fetched from IGDB (covers, screenshots, etc.)
      - redis_data:/redis-data # Cached data for background tasks
      - /mnt/nas/romm/library:/romm/library # Your game library. Check https://github.com/rommapp/romm?tab=readme-ov-file#folder-structure for more details.
      - /mnt/nas/romm/assets:/romm/assets # Uploaded saves, states, etc.
      - ./config.yml:/romm/config/config.yml # Path where config.yml is stored
    networks:
      - traefik
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
    labels:
      traefik.enable: true
      traefik.http.routers.romm.rule: Host(`romm.74services.net`)
      glance.name: Romm
      glance.id: romm
      glance.category: Media
      glance.icon: sh:romm
      glance.url: https://romm.74services.net
      glance.description: ROM Management System
  db:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: romm
      MARIADB_USER: romm-user
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      start_period: 30s
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  resources:
  redis_data:
  db:

networks:
  traefik:
    external: true