services:
  app:
    image: rommapp/romm:latest@sha256:8677fb7b81b1d3db20b849e989a1dadc2a11159e51eb34a2acdcb01102274edf
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: romm
      DB_USER: romm-user
      DB_PASSWD: ${DB_PASSWORD}
      ROMM_AUTH_SECRET_KEY: ${AUTH_KEY}
      SCREENSCRAPER_USER: ${SCREENSCRAPER_USER}
      SCREENSCRAPER_PASSWORD: ${SCREENSCRAPER_PASSWORD}
      # RETROACHIEVEMENTS_API_KEY: # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#retroachievements
      # STEAMGRIDDB_API_KEY: # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#steamgriddb
      HASHEOUS_API_ENABLED: true # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#hasheous
    volumes:
      - /mnt/docker-data/romm/resources:/romm/resources # Resources fetched from IGDB (covers, screenshots, etc.)
      - /mnt/docker-data/romm/redis_data:/redis-data # Cached data for background tasks
      - /mnt/nas/romm/library:/romm/library # Your game library. Check https://github.com/rommapp/romm?tab=readme-ov-file#folder-structure for more details.
      - /mnt/nas/romm/assets:/romm/assets # Uploaded saves, states, etc.
      - ./config.yml:/romm/config/config.yml # Path where config.yml is stored
    networks:
      - traefik
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
    labels:
      traefik.enable: true
      traefik.http.routers.romm.rule: Host(`romm.74services.net`)
      traefik.http.services.romm.loadbalancer.server.port: 8080
      homelab.canonical-route: https://romm.74services.net
      glance.name: Romm
      glance.id: romm
      glance.category: Media
      glance.icon: sh:romm
      glance.url: https://romm.74services.net
      glance.description: ROM Management System
  db:
    image: mariadb:latest@sha256:f4054da26e3a9dd6c8b5cc97363e544408b15c0fb369d7359c25dc04826eb6e1
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: romm
      MARIADB_USER: romm-user
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /mnt/docker-data/romm/db:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      start_period: 30s
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  traefik:
    external: true
